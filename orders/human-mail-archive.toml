# af-q55qqx.10: the `human` mailbox has no reader and grew to 3324 unread
# messages, enough for gc's status to report its mail count timed out (1 s)
# and for the Cockpit's health to stay ok:false. 200 a run, hourly: a backlog
# drains in a day, the ~50 a day stay far below.
[order]
description = "Archive mail to human older than 3 days, 200 a run: nobody reads that mailbox (the Cockpit is Benjamin's channel), and its backlog made gc's status partial (af-q55qqx.10)."
trigger = "cooldown"
interval = "1h"
exec = "/home/benja/agent-factory/bin/order-pause gate human-mail-archive -- /home/benja/agent-factory/bin/human-mail-archive"
timeout = "120s"
