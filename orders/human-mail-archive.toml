# af-q55qqx.10: the `human` mailbox has no reader and grew to 3324 unread
# messages, enough for gc's status to report its mail count timed out (1 s)
# and for the Cockpit's health to stay ok:false. Every 15 minutes, chunks of
# 10 for at most 60 s (about 45 messages under Dolt load, 21/11): the backlog
# drains in about a day, the ~50 a day stay far below. 120 s = gate 20 +
# inbox read + 60 s budget + the last chunk.
[order]
description = "Archive mail to human older than 3 days, every 15 minutes within a 60 s budget: nobody reads that mailbox (the Cockpit is Benjamin's channel), and its backlog made gc's status partial (af-q55qqx.10)."
trigger = "cooldown"
interval = "15m"
exec = "/home/benja/agent-factory/bin/order-pause gate human-mail-archive -- /home/benja/agent-factory/bin/human-mail-archive"
timeout = "120s"
