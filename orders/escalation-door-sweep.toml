[order]
description = "Promote every Mayor-first escalation still unresolved 2 hours after its first page to a straight-to-Benjamin escalation (O06 routing rule). T10 (af-u61al3): condition trigger delegates to orders-restart-stagger.sh so a restart after a pause spreads this order's first firing instead of bursting with every other cooldown order on the same tick; steady-state cadence is unchanged (still fires every 15m)."
trigger = "condition"
interval = "15m"
check = "/home/benja/agent-factory/orders/lib/orders-restart-stagger.sh escalation-door-sweep 900"
exec = "/home/benja/agent-factory/bin/order-pause gate escalation-door-sweep -- /home/benja/agent-factory/bin/escalation-door sweep"
# One full list, then one action-time revalidation + write + mail per due page.
# tests/escalation-door-test.sh holds this operation budget under slow calls;
# lock contention is an explicit exit-75 deferral retried on the next pass.
# af-kvi78c: 87 s at a load of 9 (22/11), list 13 to 45 s by itself, so 60 s
# killed it. The sweep starts no page past 90 s, list included; 180 s = gate
# + 10 s lock wait + 90 s + the page in flight (three calls).
timeout = "180s"
