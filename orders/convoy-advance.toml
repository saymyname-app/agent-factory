# T04 (af-gfyj6k, Spec af-wf4w5r §0 rule 3): code, not the Mayor, starts the
# ready tickets of every convoy that carries the new-flow mark. The check is
# one tracker read (is there an open marked convoy?), so this order costs
# nothing and runs nothing while no such convoy exists; a convoy without the
# mark is never read past that check and stays advanced by the Mayor.
# The controller evaluates a `condition` order on each of its ticks: the
# check, not `interval`, paces it (observed on gc 1.4.1: a pass every 20-30 s
# while a marked convoy is open).
# T34 (af-ckwina, §0 rule 5): a convoy in an « état sans règle » is stopped by
# the pass, which raises one factory incident through bin/escalation-door.
# --stopped-ok keeps that from also being an order failure on every tick
# (on-order-failed would page the Mayor about a convoy he must not touch);
# the order still fails when an incident could not be raised.
# T18 (af-gmz9s1, §4): the same pass merges one finished ticket per convoy into
# the integration branch of its Spec, through bin/spec-integration, with tests
# on the merged result. A ticket returned to its author is an outcome, not an
# order failure; a merge pass that could not run fails the order.
# T14 (af-96cusm, §6): before that merge, the same pass has the code of each
# finished ticket reviewed, through bin/code-review settle (a reviewer
# session per review, one relaunch, then the stop of the ticket). A ticket
# without a favorable verdict is not merged; that is an outcome, not an
# order failure.
# T15 (af-higj9z, §7): the same pass has each finished ticket evaluated on the
# launched product, through bin/ticket-evaluation settle (the product launched
# from a clean copy of the ticket's commit, an Evaluator session per
# evaluation, one relaunch, then the stop of the ticket; for a prefactoring,
# code checks that the product starts). The launched products outlive the
# pass and are stopped by a later one, once the states are in.
# T17 (af-rx0ocp, §8): once the review and the evaluation of a ticket have both
# answered and one refused, the same pass opens its single correction round
# and sends it to one fresh author session, through bin/correction-round
# settle; a ticket still refused after that round is stopped and raised once.
# A stopped ticket is an outcome, not an order failure.
[order]
description = "Starts the ready tickets of every open convoy that carries the new-flow mark, in dependency order and under the factory-wide ceiling N (config/delivery-flow.json), through bin/dispatch-door; has the code of each finished ticket reviewed through bin/code-review and the ticket evaluated on the launched product through bin/ticket-evaluation, sends what they refuse to one author session once and stops a ticket still refused through bin/correction-round, then merges one reviewed and evaluated ticket per convoy into the integration branch of its Spec through bin/spec-integration; stops a convoy in a state without rule and raises one factory incident for it. No agent takes part."
trigger = "condition"
interval = "1m"
check = "/home/benja/agent-factory/bin/convoy-advance --check-only"
exec = "/home/benja/agent-factory/bin/convoy-advance --all --stopped-ok"
timeout = "300s"
