# Code, not the Mayor, advances every convoy that carries the new-flow mark.
# What a pass does, step by step, its answers and its exits:
# docs/CONVOY_ADVANCE.md.
# check: one tracker read (is a marked convoy open, or closed outside its
# commands?). While there is none, the order costs that read and runs
# nothing; a convoy without the mark stays advanced by the Mayor.
# trigger, interval: the controller evaluates a `condition` order on each of
# its ticks, so the check, not `interval`, paces it (observed on gc 1.4.1: a
# pass every 20-30 s while the check passes).
# exec, --stopped-ok: a convoy in an « état sans règle » is stopped by the
# pass, which raises one factory incident through bin/escalation-door.
# --stopped-ok keeps that from also being an order failure on every tick
# (on-order-failed would page the Mayor about a convoy he must not touch).
# A pass whose only failures are explicit capacity deferrals exits 75: the
# controller retries it, while on-order-failed excludes that non-actionable
# exit from its chronic-failure threshold. A mixed or genuine error exits 1.
# The order still fails when an incident could not be raised or a step of the
# pass could not run; a ticket refused, returned or stopped is an outcome of
# the pass, not an order failure.
# timeout: longer than what one pass can wait on (bin/spec-integration: the
# control of the integration branch, then the tests of the merged result,
# 600 s each). At 300 s, on 21/10/2026, the order killed each pass before its
# tests ended; the tests ran on, orphaned, and the next pass started others in
# the same work tree: no merge was ever recorded and the VM saturated
# (af-strhoy). Passes stay one at a time (the whole-pass lock).
[order]
description = "Advances by code every open convoy that carries the new-flow mark: starts its ready tickets under the ceiling N, has each finished ticket reviewed, evaluated and merged, runs the end of its Spec, and stops a convoy in a state without rule with one factory incident. No agent takes part. Each step: docs/CONVOY_ADVANCE.md."
trigger = "condition"
interval = "1m"
check = "/home/benja/agent-factory/bin/convoy-advance --check-only"
exec = "/home/benja/agent-factory/bin/order-pause gate convoy-advance -- /home/benja/agent-factory/bin/convoy-advance --all --stopped-ok"
# 40 min, derived from config/test-budgets.json: one wait for the host and
# two full regressions (a take-up control, then the tests of the merged
# result), two margins. `bin/test-budgets check-order` holds it
# (tests/test-budgets-test.py; study C, T3).
timeout = "50m"
