[order]
description = "Daily, zero-token model-id staleness check (ADR-0018 part 2, af-a1t44): compare the model id configured for each provider in city.toml against config/model-catalog.json's recommended list, and file a bead + mail the Mayor on drift. Never switches a model -- that stays a human/PO call."
# Cron, not cooldown (O13, spec-factory-operations-v2-2026-09-28): a 24h
# cooldown drifts across restarts (each restart resets the clock from
# whenever it happened to fire); cron pins it to a fixed, predictable time.
trigger = "cron"
schedule = "0 3 * * *"
exec = "/home/benja/agent-factory/bin/order-pause gate model-staleness-check -- ./bin/provider-failover check-models --quiet"
timeout = "60s"
