# T10 (af-u61al3): condition trigger + orders-restart-stagger.sh spreads
# this order's first post-restart firing instead of bursting with every
# other cooldown order on the same tick; steady-state cadence (still 2m)
# is unchanged. See orders/escalation-door-sweep.toml for the full note.
[order]
description = "Zero-token provider failover (ADR-0018): detect quota walls in live sessions, keep every target on a provider that can work, regenerate city.provider.toml, and restart sessions stuck on an exhausted pool"
trigger = "condition"
interval = "2m"
check = "/home/benja/agent-factory/orders/lib/orders-restart-stagger.sh provider-failover 120"
exec = "/home/benja/agent-factory/bin/order-pause gate provider-failover -- ./bin/provider-failover tick --quiet"
timeout = "100s"
