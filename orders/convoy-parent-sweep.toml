[order]
description = "Deterministic zero-token cleanup (af-mu8j4): auto-close open convoy/drain-unit beads whose tracked child issues are all closed, via the existing `gc convoy check`. Prevents closed-parent convoys from lingering in the ready list -- it does not touch wisps (wisp-compact already TTL-sweeps those) or order-tracking beads (order-tracking-sweep already owns that retention)."
# Event-triggered (O13, spec-factory-operations-v2-2026-09-28): a convoy can
# only go closeable when one of its tracked children closes, so the 15m
# cooldown was pure polling. `bead.closed` fires this exactly when there is
# something to check, with no drift in reaction time.
# T22 (af-kn83no, Spec af-wf4w5r §9): a convoy that carries the new-flow mark
# is not closed here. bin/convoy-state mark puts it under Gas City's manual
# lifecycle (label `owned`), which `gc convoy check` skips: it closes only by
# code, on the operator's words. A convoy without the mark is closed as before.
trigger = "event"
on = "bead.closed"
exec = "/home/benja/agent-factory/bin/order-pause gate convoy-parent-sweep -- gc convoy check --json"
# af-5e33u6: successful city-wide scans reached 58.88s and five runs then hit
# this order's old 60s deadline under load. Two minutes keeps one bounded run
# while leaving headroom for the pause-gate tracker read and convoy scan.
timeout = "120s"
