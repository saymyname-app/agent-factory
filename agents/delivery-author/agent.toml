description = "Delivery role: ticket author (tdd, codebase-design; reads implement). Skills per config/delivery-roles.json"
scope = "city"
work_dir = ".gc/agents/delivery-author"
min_active_sessions = 0
# N authors in parallel (Spec §4): the ceiling of config/delivery-flow.json
# (max_sessions), which bin/convoy-advance enforces across the three roles.
# A lower cap here leaves a started ticket waiting for the session of another
# (tests/delivery-agents-test.sh holds the two equal).
max_active_sessions = 3
idle_timeout = "2h"

# One session works one ticket. Gas City's default work query offers the
# unassigned work routed to this agent to any of its sessions, so a session
# that holds a ticket would take the first step of another one (seen in the
# isolated-city trial of 2026-10-06); `bin/ticket-author start` then refuses
# it and the attempts of that step are spent. This query is the default one
# with that single difference: a session that has ever been assigned a bead
# is offered, of the unassigned work, only that of the workflows it already
# works (a step given back after a refused check is unassigned).
work_query = '''sh -c 'for id in "$GC_SESSION_ID" "$GC_SESSION_NAME" "$GC_ALIAS"; do [ -z "$id" ] && continue; r=$(bd list --status in_progress --assignee="$id" --json --limit=1 2>/dev/null); [ -n "$r" ] && [ "$r" != "[]" ] && printf "%s" "$r" && exit 0; done; for id in "$GC_SESSION_ID" "$GC_SESSION_NAME" "$GC_ALIAS"; do [ -z "$id" ] && continue; r=$(bd ready --assignee="$id" --json --limit=1 2>/dev/null); [ -n "$r" ] && [ "$r" != "[]" ] && printf "%s" "$r" && exit 0; done; mine=$(for id in "$GC_SESSION_ID" "$GC_SESSION_NAME" "$GC_ALIAS"; do [ -z "$id" ] && continue; if [ "$id" = "$GC_ALIAS" ]; then bd list --all --assignee="$id" --metadata-field "gc.session_id=$GC_SESSION_ID" --json --limit=0 2>/dev/null; else bd list --all --assignee="$id" --json --limit=0 2>/dev/null; fi; done | jq -sc "[.[][] | .metadata[\"gc.root_bead_id\"] // empty] | unique" 2>/dev/null); r=$(bd ready --metadata-field "gc.routed_to=$1" --unassigned --exclude-type=epic --json --sort oldest --limit=20 2>/dev/null); [ -n "$r" ] || r="[]"; case "$mine" in ""|"[]") ;; *) r=$(printf "%s" "$r" | jq -c --argjson mine "$mine" "[.[] | select(.metadata[\"gc.root_bead_id\"] as \$root | \$mine | index(\$root))]" 2>/dev/null); [ -n "$r" ] || r="[]" ;; esac; printf "%s" "$r"' -- delivery-author'''

# Claude Code ships its own code-review/security-review/simplify skills; a
# permission deny rule leaves them listed. This switch removes them, so an
# author session has no way to launch a review (role-adoption-trial proves it).
[env]
CLAUDE_CODE_DISABLE_BUNDLED_SKILLS = "1"
