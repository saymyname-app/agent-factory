description = "Delivery role: code reviewer (code-review), read-only. Skills per config/delivery-roles.json"
scope = "city"
work_dir = ".gc/agents/delivery-reviewer"
min_active_sessions = 0
max_active_sessions = 1
idle_timeout = "2h"

# Fallback only: the effective provider comes from city.provider.toml
# (bin/provider-failover, target delivery-reviewer). A read-only role must
# never fall back to the workspace provider, which can write.
provider = "claude-readonly"

# The role's only review skill is its own copy of Matt Pocock's code-review.
# Claude Code ships review skills of its own (security-review, code-review,
# simplify) that the reviewer's formula never calls; this switch removes them
# (role-adoption-trial proves it, and that the role's copy still loads).
[env]
CLAUDE_CODE_DISABLE_BUNDLED_SKILLS = "1"
