# Effective model providers come from city.provider.toml, generated and kept
# current by bin/provider-failover from config/provider-policy.json and the
# quota walls it detects (ADR-0018). It must stay the first key of this file.
# Change providers with `./bin/provider-failover set`, never by editing here.
include = ["city.provider.toml"]

[workspace]
# Fallback only, used if the generated overlay says nothing. Nobody has to
# remember to "revert" anything any more: failover returns to Codex on its own
# once its quota resets.
provider = "claude-standard"

[providers]
[providers.codex]
base = "builtin:codex"
args_append = ["-m", "gpt-5.6-sol"]
ready_delay_ms = 0
accept_startup_dialogs = true

[providers.claude]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
# Unattended agent, nobody at the terminal: never let it pause waiting for a
# human answer. Make the reasonable call and record it instead of stalling.
# Plan mode is the same trap: ExitPlanMode ends the turn awaiting an approval
# nobody will give (audit 2026-09-17, P7).
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude.option_defaults]
permission_mode = "unrestricted"
model = "sonnet-5"
effort = "high"

# Lower-cost profile for high-volume/routine roles (orchestration, dispatch,
# mechanical steps) that don't need the top reasoning tier. Same account,
# same subscription billing, same base engine as [providers.claude] — only
# the reasoning effort differs. Point an agent at this by setting
# provider = "claude-standard" in its agents/<name>/agent.toml.
[providers.claude-standard]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude-standard.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-standard.option_defaults]
permission_mode = "unrestricted"
model = "sonnet-5"
effort = "medium"

# Cheapest Claude tier (~$1/$5 per 1M tokens vs Sonnet 5's ~$2-3/$10-15) for
# genuinely low-judgment, high-volume work: classification, triage, simple
# deterministic-ish checks. Not yet assigned to any agent — the natural
# targets (issue-triager and similar) are defined in the imported remote
# pack, not this repo, and pack-scoped agents haven't been confirmed to
# accept a local provider override. Verify that before relying on this for
# anything pack-provided.
[providers.claude-cheap]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude-cheap.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-cheap.option_defaults]
permission_mode = "unrestricted"
model = "haiku"
effort = "low"

