# Effective model providers come from city.provider.toml, generated and kept
# current by bin/provider-failover from config/provider-policy.json and the
# quota walls it detects (ADR-0018). It must stay the first key of this file.
# Change providers with `./bin/provider-failover set`, never by editing here.
include = ["city.provider.toml"]

[workspace]
# Fallback only, used if the generated overlay says nothing. Nobody has to
# remember to "revert" anything any more: failover returns to Codex on its own
# once its quota resets.
provider = "claude-standard"

[providers]
[providers.codex]
base = "builtin:codex"
args_append = ["-m", "gpt-5.6-sol"]
ready_delay_ms = 0
accept_startup_dialogs = true

[providers.claude]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
# Unattended agent, nobody at the terminal: never let it pause waiting for a
# human answer. Make the reasonable call and record it instead of stalling.
# Plan mode is the same trap: ExitPlanMode ends the turn awaiting an approval
# nobody will give (audit 2026-09-17, P7).
#
# Intent (Benjamin, his words, 2026-10-06): « dans l'usine il faut utiliser
# Opus 5.5 ».
# Mechanism (agent interpretation): every Claude profile of this file runs
# claude-opus-5-5 and the Codex-first fallback chains are untouched. The id
# is passed in args_append (as Codex does with
# `-m`), NOT as option_defaults.model: gc validates that key against its own
# closed list, which stops at opus-4-8 in the installed 1.4.1 and at opus-5
# in upstream 1.5.0. An unknown value there fails `gc bd`'s provider cache
# build and puts the coordination store in fail-closed (2026-09-19, PR #151).
# builtin:claude has no default model, so this is the only --model emitted.
# Needs host Claude CLI >= 2.1.280. bin/provider-failover check-models reads
# the id from here.
#
# Context floor (af-qgwvgi, measured 2026-10-11 on Claude CLI 2.1.290, one
# headless turn in a Factory worktree). The tool list is sent again on every
# turn, so a tool no session calls is paid on each of them. Context tokens of
# the first turn: 36,886 with the three tools above alone; 33,576 with the
# list below; 26,713 once --strict-mcp-config is added (-28%).
# - --disallowedTools also names the tools a session without a screen or an
#   operator never called in the 262 transcripts of the 7 days before. Left
#   available because sessions do call them: Agent, Bash, Edit, Monitor,
#   Read, ScheduleWakeup, Skill, TaskStop, ToolSearch, Write; WebFetch and
#   WebSearch stay for research.
# - --strict-mcp-config loads no MCP server. Without it every session
#   inherits the claude.ai connectors of the account (Gmail, Drive, Calendar,
#   Notion, Figma, Docs: 148 tools) and the servers of its plugins. No
#   Factory session called one, and an unattended session with unrestricted
#   permissions has no reason to hold them. To give a server back to a
#   profile, name it there with --mcp-config.
# The three Claude profiles carry the same two flags
# (tests/city-claude-profiles-test.py).
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode,CronCreate,CronDelete,CronList,DesignSync,EnterWorktree,ExitWorktree,ListAgents,ListMcpResourcesTool,NotebookEdit,PushNotification,ReadMcpResourceDirTool,ReadMcpResourceTool,RemoteTrigger,ReportFindings,SendMessage,Workflow",
               "--strict-mcp-config",
               "--model", "claude-opus-5-5"]

[providers.claude.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude.option_defaults]
permission_mode = "unrestricted"
effort = "high"

# Same model as [providers.claude] (claude-opus-5-5), same account and
# subscription billing: only the reasoning effort differs (medium instead of
# high). For high-volume/routine roles (orchestration, dispatch, mechanical
# steps). Point an agent at this by setting provider = "claude-standard" in
# its agents/<name>/agent.toml.
[providers.claude-standard]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode,CronCreate,CronDelete,CronList,DesignSync,EnterWorktree,ExitWorktree,ListAgents,ListMcpResourcesTool,NotebookEdit,PushNotification,ReadMcpResourceDirTool,ReadMcpResourceTool,RemoteTrigger,ReportFindings,SendMessage,Workflow",
               "--strict-mcp-config",
               "--model", "claude-opus-5-5"]

[providers.claude-standard.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-standard.option_defaults]
permission_mode = "unrestricted"
effort = "medium"

# Read-only profile for the delivery roles that must not write: the reviewer
# and the Evaluator (T03, af-pbxbgj, Spec af-wf4w5r §1). Same account, model
# and effort as [providers.claude]; the only difference is `command`: gc 1.4.1
# has no read-only switch for an agent, so the session is launched through
# bin/delivery-role-sandbox, which runs the real binary (named in
# DELIVERY_ROLE_SANDBOX_EXEC) with every path read-only except the session's
# own work directory, provider state, city runtime and tracker, and without a
# push credential. bin/role-adoption-trial proves it on a real session and
# bin/dispatch-door refuses a read-only role on a provider with no such proof.
[providers.claude-readonly]
base = "builtin:claude"
command = "/home/benja/agent-factory/bin/delivery-role-sandbox"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode,CronCreate,CronDelete,CronList,DesignSync,EnterWorktree,ExitWorktree,ListAgents,ListMcpResourcesTool,NotebookEdit,PushNotification,ReadMcpResourceDirTool,ReadMcpResourceTool,RemoteTrigger,ReportFindings,SendMessage,Workflow",
               "--strict-mcp-config",
               "--model", "claude-opus-5-5"]

[providers.claude-readonly.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"
DELIVERY_ROLE_SANDBOX_EXEC = "/home/benja/.local/bin/claude"

[providers.claude-readonly.option_defaults]
permission_mode = "unrestricted"
effort = "high"

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# Per-order verdicts from Spec spec-factory-operations-v2-2026-09-28 (ticket
# O13), applied without forking any pack order file. Each interval/trigger
# change below was checked against the pack script it drives (see
# docs/planning/factory-operations-v2/orders-best-practices.md section 1,
# "check that the pack script tolerates the longer gap") before being made.
[orders]
# dolt-remotes-patrol: no Dolt remote is configured, so every run is a
# guaranteed no-op (spec decision).
# nudge-mail-sweep: the controller watchdog already runs this same sweep
# every 5 minutes on its own (order's own header comment) -- duplicate owner.
# prune-branches: no `gc/*` branch exists in this city or its rigs; cleanup
# belongs to factory-maintain per the spec decision.
# cross-rig-deps: 934 runs since 2026-09-21 (5m cooldown) produced zero
# "bead"-type cross-rig gates -- this city measures zero cross-rig
# dependencies for the order to convert.
# orphan-sweep: replaced by orders/factory-orphan-sweep.toml (W08, A6b,
# Spec af-3s8prq). The core sweep drops any in_progress claim held by an
# assignee it doesn't recognize, including a po-agent/* operator session's
# claim on a planning ticket -- a parallel session can then take the same
# ticket minutes later. The Factory order runs bin/factory-orphan-sweep, a
# copy of the same upstream script plus a guard that treats po-agent/*
# claims and planning-plane beads as owned; every other orphaned claim is
# still released.
# renudge-stale-human-gates: re-mails the addressee of a human gate left
# open. AGENTS.md forbids creating a human gate, none was open on 2026-10-11
# and the order still ran every 5 minutes (af-qgwvgi). An aged human gate is
# still paged without it: factory-watchdog (section 1) raises it to the Mayor
# past 30 minutes, and notify-on-human-gate-creation still fires at creation.
skip = ["dolt-remotes-patrol", "nudge-mail-sweep", "prune-branches", "cross-rig-deps", "orphan-sweep",
        "renudge-stale-human-gates"]

[[orders.overrides]]
# dolt-health.sh only checks live server health; a 2m gap is still well
# inside any operator's reaction window and halves the 30s health-probe
# volume together with beads-health.
# T10 (af-u61al3): condition trigger + orders-restart-stagger.sh spreads
# this order's first post-restart firing instead of bursting with every
# other cooldown order on the same tick; steady-state cadence (still 2m)
# is unchanged. See orders/escalation-door-sweep.toml for the full note.
name = "dolt-health"
trigger = "condition"
interval = "2m"
check = "/home/benja/agent-factory/orders/lib/orders-restart-stagger.sh dolt-health 120"

[[orders.overrides]]
# beads-health.sh only checks provider health and self-heals; same
# reasoning as dolt-health above.
# T10 (af-u61al3): see the dolt-health override above.
name = "beads-health"
trigger = "condition"
interval = "2m"
check = "/home/benja/agent-factory/orders/lib/orders-restart-stagger.sh beads-health 120"

[[orders.overrides]]
# gc order sweep-tracking --stale-after 10m is idempotent and only prunes;
# a 10m sweep cadence still catches everything before its own 10m staleness
# window closes.
# T10 (af-u61al3): see the dolt-health override above.
name = "order-tracking-sweep"
trigger = "condition"
interval = "10m"
check = "/home/benja/agent-factory/orders/lib/orders-restart-stagger.sh order-tracking-sweep 600"

[[orders.overrides]]
# gate-sweep.sh is a pure mechanical evaluation (no LLM) that is a no-op
# when there is nothing open -- retrigger on "open gates > 0" instead of
# polling every 30s.
name = "gate-sweep"
trigger = "condition"
check = "test \"$(bd gate list --json 2>/dev/null | jq 'length' 2>/dev/null || echo 0)\" -gt 0"

[beads.policies.order_tracking]
# af-hpux0u: order-tracking-sweep lists every retained closed tracking bead,
# twice per run (confirm-gate count, then prune). At the 7d default that was
# ~60,000 wisps (~10,000 closed per day): ~1 min idle, past the Dolt read
# budget under load (6 failures out of 10 runs, 2026-10-13). 24h keeps the
# scan ~7x smaller. The latest 10 closed runs per order are always kept
# (hardcoded upstream), so cooldown/last-run reads are unaffected, and
# on-order-failed reads events, not these beads.
delete_after_close = "24h"

[events.rotation]
# 14 days (336h), per the Spec's decision -- the ticket text is authoritative
# over the 720h figure in orders-best-practices.md's draft recommendation.
archive_retain_age = "336h"

[mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
retention_ttl = "168h"

[[rigs]]
