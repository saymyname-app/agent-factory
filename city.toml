[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# Per-order verdicts from Spec spec-factory-operations-v2-2026-09-28 (ticket
# O13), applied without forking any pack order file. Each interval/trigger
# change below was checked against the pack script it drives (see
# docs/planning/factory-operations-v2/orders-best-practices.md section 1,
# "check that the pack script tolerates the longer gap") before being made.
[orders]
# dolt-remotes-patrol: no Dolt remote is configured, so every run is a
# guaranteed no-op (spec decision).
# nudge-mail-sweep: the controller watchdog already runs this same sweep
# every 5 minutes on its own (order's own header comment) -- duplicate owner.
# prune-branches: no `gc/*` branch exists in this city or its rigs; cleanup
# belongs to factory-maintain per the spec decision.
# cross-rig-deps: 934 runs since 2026-09-21 (5m cooldown) produced zero
# "bead"-type cross-rig gates -- this city measures zero cross-rig
# dependencies for the order to convert.
# orphan-sweep: replaced by orders/factory-orphan-sweep.toml (W08, A6b,
# Spec af-3s8prq). The core sweep drops any in_progress claim held by an
# assignee it doesn't recognize, including a po-agent/* operator session's
# claim on a planning ticket -- a parallel session can then take the same
# ticket minutes later. The Factory order runs bin/factory-orphan-sweep, a
# copy of the same upstream script plus a guard that treats po-agent/*
# claims and planning-plane beads as owned; every other orphaned claim is
# still released.
skip = ["dolt-remotes-patrol", "nudge-mail-sweep", "prune-branches", "cross-rig-deps", "orphan-sweep"]

[[orders.overrides]]
# dolt-health.sh only checks live server health; a 2m gap is still well
# inside any operator's reaction window and halves the 30s health-probe
# volume together with beads-health.
name = "dolt-health"
interval = "2m"

[[orders.overrides]]
# beads-health.sh only checks provider health and self-heals; same
# reasoning as dolt-health above.
name = "beads-health"
interval = "2m"

[[orders.overrides]]
# gc order sweep-tracking --stale-after 10m is idempotent and only prunes;
# a 10m sweep cadence still catches everything before its own 10m staleness
# window closes.
name = "order-tracking-sweep"
interval = "10m"

[[orders.overrides]]
# gate-sweep.sh is a pure mechanical evaluation (no LLM) that is a no-op
# when there is nothing open -- retrigger on "open gates > 0" instead of
# polling every 30s.
name = "gate-sweep"
trigger = "condition"
check = "test \"$(bd gate list --json 2>/dev/null | jq 'length' 2>/dev/null || echo 0)\" -gt 0"

[events.rotation]
# 14 days (336h), per the Spec's decision -- the ticket text is authoritative
# over the 720h figure in orders-best-practices.md's draft recommendation.
archive_retain_age = "336h"

[mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
retention_ttl = "168h"

[[rigs]]
name = "saymyname-backend"
prefix = "smb"
default_branch = "dev"
suspended_on_start = false
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "saymyname-frontend"
prefix = "smf"
default_branch = "dev"
suspended_on_start = false
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# Periodic Dolt store maintenance (gc + snapshot), 2026-09-16.
# The loop exists and runs inside the supervisor, but had never been enabled,
# so compaction only ever happened when a human noticed the store growing.
# A clean shutdown alone reclaimed 511 MB -> 379 MB during the maintenance
# window, which is how much was sitting there uncollected. Enabling the loop
# turns that from something somebody remembers into something that happens.
[maintenance.dolt]
enabled = true

# Caps on the implicit worker and reviewer pools. They had no cap: on
# 2026-09-18 four city workers plus a reviewer and the rigs' Maven/Testcontainers
# runs left the host ~500 MB of free RAM, WSL at load 15-20 on 12 vCPU, and the
# campaign sentinel timing out. DELIVERY.md/AGENTS.md always said "one writer
# per rig"; this is where it is enforced rather than hoped. Benjamin
# (2026-09-18): restrict the Factory to what the machine has until RAM is
# added. Sessions are slot-named (claude-1, claude-2) as soon as a cap exists,
# so 1 changes nothing further in naming; the load test (af-48sx3) measures it.
# Patches, not agents/<name>/, because a directory there normally needs its
# own provider-policy target. agents/factory-worker is the deliberate
# exception: it has no provider pin and is tested as a workspace inheritor,
# so provider-failover changes to workspace move the HQ writer too.
[[patches.agent]]
name = "claude"
max_active_sessions = 2

[[patches.agent]]
name = "claude"
dir = "saymyname-backend"
max_active_sessions = 1

[[patches.agent]]
name = "claude"
dir = "saymyname-frontend"
max_active_sessions = 1

# claude-reviewer retired 2026-09-28 (O14, F15): no formula or prompt ever
# dispatched it (dispatch-door has no path for an ad-hoc named reviewer
# session, only a rig's fixed sling_target); its patch went with it. See
# docs/INVENTORY.md for where it moved.

# bd.dog (builtin bd pack) ships with idle_timeout set but no sleep_after_idle,
# so effective_sleep_after_idle resolves to legacy "off": the session never
# actually sleeps between checks. Live-observed 2026-09-18 (af-7fmj9): the
# idle-claim nudge mechanism then wakes it roughly every ~2 min for a full LLM
# turn even with nothing to do, and on 2026-09-18 02:00-06:00Z two dog
# instances did this at 40-90s intervals for ~4 hours straight. 300s matches
# the sleep_after_idle already used for refinery in the same imported pack
# family and cuts the wake cadence materially without touching idle_timeout
# (2h), which still reaps a truly-abandoned session -- the Dolt watchdog
# function is unchanged, only how often it burns a turn to find nothing.
[[patches.agent]]
name = "dog"
sleep_after_idle = "300s"
