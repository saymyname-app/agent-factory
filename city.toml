# Effective model providers come from city.provider.toml, generated and kept
# current by bin/provider-failover from config/provider-policy.json and the
# quota walls it detects (ADR-0018). It must stay the first key of this file.
# Change providers from the cockpit (Fournisseurs IA), never by editing here.
include = ["city.provider.toml"]

[workspace]
# Fallback only, used if the generated overlay says nothing. Nobody has to
# remember to "revert" anything any more: failover returns to Codex on its own
# once its quota resets.
provider = "claude-standard"

[providers]
[providers.codex]
base = "builtin:codex"
args_append = ["-m", "gpt-5.6-sol"]
ready_delay_ms = 0
accept_startup_dialogs = true

[providers.claude]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
# Unattended agent, nobody at the terminal: never let it pause waiting for a
# human answer. Make the reasonable call and record it instead of stalling.
# Plan mode is the same trap: ExitPlanMode ends the turn awaiting an approval
# nobody will give (audit 2026-09-17, P7).
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude.option_defaults]
permission_mode = "unrestricted"
model = "sonnet-5"
effort = "high"

# Lower-cost profile for high-volume/routine roles (orchestration, dispatch,
# mechanical steps) that don't need the top reasoning tier. Same account,
# same subscription billing, same base engine as [providers.claude] — only
# the reasoning effort differs. Point an agent at this by setting
# provider = "claude-standard" in its agents/<name>/agent.toml.
[providers.claude-standard]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude-standard.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-standard.option_defaults]
permission_mode = "unrestricted"
model = "sonnet-5"
effort = "medium"

# Cheapest Claude tier (~$1/$5 per 1M tokens vs Sonnet 5's ~$2-3/$10-15) for
# genuinely low-judgment, high-volume work: classification, triage, simple
# deterministic-ish checks. Not yet assigned to any agent — the natural
# targets (issue-triager and similar) are defined in the imported remote
# pack, not this repo, and pack-scoped agents haven't been confirmed to
# accept a local provider override. Verify that before relying on this for
# anything pack-provided.
[providers.claude-cheap]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude-cheap.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-cheap.option_defaults]
permission_mode = "unrestricted"
model = "haiku"
effort = "low"

# DISABLED 2026-09-19: the installed `gc` binary's own model validator (not
# the `claude` CLI's) does not recognize any Opus 5 identifier yet — its
# highest known opus ids are claude-opus-4-7 / claude-opus-4-8 (confirmed via
# `strings /usr/local/bin/gc`, no "opus-5"/"claude-opus-5" anywhere). The
# PR #151 value "claude-opus-5" failed `gc bd`'s "provider cache build" at
# startup ("not a valid choice"), which put the whole coordination store in
# fail-closed and broke the cockpit ("Failed to fetch") after a PC-crash
# restart surfaced it. Re-enable only once `gc` itself is upgraded to know
# about Opus 5 (or a confirmed-valid identifier is found) — do NOT
# reintroduce "claude-opus-5" or "opus-5" without re-verifying against the
# installed `gc` binary's own validator, not just the `claude --help` text
# (that check is what missed this the first time).
# [providers.claude-opus]
# base = "builtin:claude"
# command = "/home/benja/.local/bin/claude"
# accept_startup_dialogs = true
# args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]
#
# [providers.claude-opus.env]
# CLAUDE_CONFIG_DIR = "/home/benja/.claude"
# DISABLE_AUTOUPDATER = "1"
#
# [providers.claude-opus.option_defaults]
# permission_mode = "unrestricted"
# model = "claude-opus-5"
# effort = "high"

# Premium tier for long-running, high-difficulty unattended work (Fable 5.1 is
# built for multi-hour, many-tool jobs). Most expensive of the claude-* tiers
# — gate its use behind an explicit reason (a specific hard ticket), not a
# default for any routine role.
# Model id corrected 2026-09-19: "claude-fable-5-1" is not recognized by the
# installed `gc` binary's own model validator (same failure as claude-opus
# above); "fable-5" is, confirmed via `strings /usr/local/bin/gc` and matches
# the short-form convention already used by the other tiers (sonnet-5, haiku).
[providers.claude-fable]
base = "builtin:claude"
command = "/home/benja/.local/bin/claude"
accept_startup_dialogs = true
args_append = ["--disallowedTools", "AskUserQuestion,EnterPlanMode,ExitPlanMode"]

[providers.claude-fable.env]
CLAUDE_CONFIG_DIR = "/home/benja/.claude"
DISABLE_AUTOUPDATER = "1"

[providers.claude-fable.option_defaults]
permission_mode = "unrestricted"
model = "fable-5"
effort = "high"

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
retention_ttl = "168h"

[[rigs]]
name = "saymyname-backend"
prefix = "smb"
default_branch = "dev"
suspended_on_start = false
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "saymyname-frontend"
prefix = "smf"
default_branch = "dev"
suspended_on_start = false
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# Periodic Dolt store maintenance (gc + snapshot), 2026-09-16.
# The loop exists and runs inside the supervisor, but had never been enabled,
# so compaction only ever happened when a human noticed the store growing.
# A clean shutdown alone reclaimed 511 MB -> 379 MB during the maintenance
# window, which is how much was sitting there uncollected. Enabling the loop
# turns that from something somebody remembers into something that happens.
[maintenance.dolt]
enabled = true

# Caps on the implicit worker and reviewer pools. They had no cap: on
# 2026-09-18 four city workers plus a reviewer and the rigs' Maven/Testcontainers
# runs left the host ~500 MB of free RAM, WSL at load 15-20 on 12 vCPU, and the
# campaign sentinel timing out. DELIVERY.md/AGENTS.md always said "one writer
# per rig"; this is where it is enforced rather than hoped. Benjamin
# (2026-09-18): restrict the Factory to what the machine has until RAM is
# added. Sessions are slot-named (claude-1, claude-2) as soon as a cap exists,
# so 1 changes nothing further in naming; the load test (af-48sx3) measures it.
# Patches, not agents/<name>/, because a directory there normally needs its
# own provider-policy target. agents/factory-worker is the deliberate
# exception: it has no provider pin and is tested as a workspace inheritor,
# so cockpit/failover changes to workspace move the HQ writer too.
[[patches.agent]]
name = "claude"
max_active_sessions = 2

[[patches.agent]]
name = "claude"
dir = "saymyname-backend"
max_active_sessions = 1

[[patches.agent]]
name = "claude"
dir = "saymyname-frontend"
max_active_sessions = 1

[[patches.agent]]
name = "claude-reviewer"
max_active_sessions = 1

# bd.dog (builtin bd pack) ships with idle_timeout set but no sleep_after_idle,
# so effective_sleep_after_idle resolves to legacy "off": the session never
# actually sleeps between checks. Live-observed 2026-09-18 (af-7fmj9): the
# idle-claim nudge mechanism then wakes it roughly every ~2 min for a full LLM
# turn even with nothing to do, and on 2026-09-18 02:00-06:00Z two dog
# instances did this at 40-90s intervals for ~4 hours straight. 300s matches
# the sleep_after_idle already used for refinery in the same imported pack
# family and cuts the wake cadence materially without touching idle_timeout
# (2h), which still reaps a truly-abandoned session -- the Dolt watchdog
# function is unchanged, only how often it burns a turn to find nothing.
[[patches.agent]]
name = "dog"
sleep_after_idle = "300s"
