name: Code Standards
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - run: pip install diff-cover==10.6.0
      - name: Changed TypeScript lines are at least 80 percent covered
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          BASE_BRANCH="${BASE_REF#refs/heads/}"
          test -n "$BASE_BRANCH"
          git fetch origin "$BASE_BRANCH"
          if git diff --quiet "origin/$BASE_BRANCH...HEAD" -- src; then
            exit 0
          fi
          test -f coverage/lcov.info
          diff-cover coverage/lcov.info --compare-branch="origin/$BASE_BRANCH" --fail-under=80
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.0
        with:
          base: ${{ github.event.merge_group.base_sha || '' }}
          head: ${{ github.event.merge_group.head_sha || '' }}
          version: '3.99.0'
          extra_args: --results=verified,unknown,unverified
  dependencies:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      upload-sarif: false
      fail-on-vuln: true
  dependencies-merge:
    if: github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      upload-sarif: false
      fail-on-vuln: true
