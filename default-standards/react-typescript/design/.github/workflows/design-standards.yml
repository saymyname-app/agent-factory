name: Design Standards
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 bin/check-design-tokens
      - run: python3 bin/check-design-css
      - run: node bin/check-design-source.mjs
