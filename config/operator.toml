# Operator identity for runtime messages that address the human decision-
# maker by name (O14, F23). Scripts read `name` from here instead of
# hardcoding it, so a clone run by a different operator does not have to
# edit script text to get correct-sounding messages.
#
# This is display text only. `gc.needs_benjamin` (the metadata field
# bin/escalation-door writes) and its `benjamin` subcommand are a stable
# schema/API referenced across scripts, tests and docs (the "NEEDS BENJAMIN"
# list is a named Factory concept, not just this operator's name) and are
# unaffected by this file — renaming those is a topology change, not this
# ticket's repair.
name = "Benjamin"

# Sender identity `bin/operator-mail` uses for mail from the operator entry
# path (docs/OPERATOR_BRIDGE.md). Never "human" and never Benjamin's name:
# the operator's Codex session is an agent acting on Benjamin's stated
# intent, not Benjamin himself, and the Mayor prompt treats every mail as an
# agent's request regardless of its displayed sender (P15).
mail_alias = "po-agent"

# Operator Language (C01 Cockpit V2, T01): the single natural language every
# Cockpit-facing and pushed text must be written in, for every project. Read
# through bin/operator-config language rather than re-parsed by hand -- that
# tool fails loudly if this field is missing or empty instead of letting a
# caller default silently to English.
language = "fr"
