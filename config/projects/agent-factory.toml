# Project file for the Factory HQ rig itself (af-vsevn). One file per
# project is the single source of truth for its rig directory, GitHub repo,
# protected branch, and required CI workflow — lib/protected_rigs.sh,
# bin/factory-guard, bin/factory-delivery-guard, bin/deliver-close, and
# bin/pr-autopilot all read this directory instead of hardcoding the rig
# list themselves. A rig with no project file here fails
# bin/project-registry's coverage check loudly instead of silently losing
# protection.
#
# sling_target/formulas (O03, af-ui0ua) feed bin/dispatch-door -- the one
# door every dispatch to this rig goes through. sling_target is the bare
# qualified-agent name (rig_dir "." means it is used unqualified); formulas
# is the comma-separated allowed-formula list for this rig.
rig_dir = "."
repo = "saymyname-app/agent-factory"
protected_branch = "main"
required_ci = "Factory CI"
# required_check (af-37h58/P03) is the ruleset's actual required status
# check name reported on a PR (the workflow's job name) -- distinct from
# required_ci above, which is the Actions *workflow* name gh run
# list/deliver-close need. Ruleset AF-main-protection (23626687) requires
# "Tests", the job bin/../.github/workflows/ci.yml names inside "Factory CI".
required_check = "Tests"
sling_target = "factory-worker"
# mol-graph-review (T08, af-n575g4) is not a delivery formula: only
# bin/graph-review dispatches it, with --role reviewer, to have a Ticket
# Graph Draft read before Benjamin approves it (docs/GRAPH_REVIEW.md).
# mol-ticket-author (T12, af-i3q5a5) is the author formula of the new flow:
# only bin/convoy-advance dispatches it, with --role author, on a ticket of a
# convoy that carries the new-flow mark (docs/TICKET_AUTHOR.md).
# mol-test-review (T13, af-nkpjpr) is not a delivery formula either: only
# bin/test-review dispatches it, with --role reviewer, to have the criterion
# tests of a ticket read before they are frozen (docs/TEST_REVIEW.md).
# mol-code-review (T14, af-96cusm) is not a delivery formula either: only
# bin/code-review dispatches it, with --role reviewer, to have the committed
# diff of a finished ticket reviewed before its merge (docs/CODE_REVIEW.md).
# mol-ticket-evaluation (T15, af-higj9z) is not a delivery formula either:
# only bin/ticket-evaluation dispatches it, with --role evaluator, to have a
# finished ticket evaluated on the launched product before its merge
# (docs/TICKET_EVALUATION.md).
# mol-outcome-evaluation (T24, af-oy7v3i) is not a delivery formula either:
# only bin/outcome-evaluation dispatches it, with --role evaluator, to have
# the assembled product of a Spec evaluated story by story once its
# end-of-Spec gate is mechanically green (docs/OUTCOME_EVALUATION.md).
# mol-ticket-correction (T17, af-rx0ocp) is not started by the pass as a
# ticket either: only bin/correction-round dispatches it, with --role author,
# to send the findings of the code review and of the Ticket Evaluation of a
# refused ticket to one fresh author session, once (docs/CORRECTION_ROUND.md).
# mol-ticket-resume (T20, af-y9pw9z) is the resume formula of the new flow:
# only bin/convoy-advance dispatches it, with --role author, to send a ticket
# whose author must take it again (interrupted, returned by the merge,
# unblocked, answered) to one fresh author session on the same branch; each
# resume is counted, the third parks the ticket (docs/CONVOY_ADVANCE.md).
formulas = "mol-do-work,mol-graph-review,mol-ticket-author,mol-test-review,mol-code-review,mol-ticket-evaluation,mol-outcome-evaluation,mol-ticket-correction,mol-ticket-resume"
# human_approver (A6b W04) is this project's declared human approver:
# bin/spec-approve refuses to approve a Spec bead whose --approved-by is
# anyone else, read via `bin/project-planning-profile human-approver`.
human_approver = "benjamin-hurand"
