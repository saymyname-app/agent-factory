# Project file for the SayMyName backend rig (af-vsevn). See
# config/projects/agent-factory.toml for what reads this directory.
#
# sling_target/formulas (O03, af-ui0ua) feed bin/dispatch-door; see that
# file's comment for what they mean.
rig_dir = "rigs/saymyname-backend"
repo = "saymyname-app/Say-my-name-back"
protected_branch = "dev"
required_ci = "Backend CI"
# required_check (af-37h58/P03): ruleset SMN-back-dev-protection (22629508)
# requires "Maven verify", the job name inside the "Backend CI" workflow --
# see config/projects/agent-factory.toml for why this differs from required_ci.
required_check = "Maven verify"
sling_target = "claude"
formulas = "mol-do-work,mol-scoped-work,mol-polecat-commit,build-basic"
# human_approver (af-vx1tkf): the tools that name a project by the rig of a
# ticket (bin/owner-answer, bin/correction-round) read it here; it is the
# approver config/projects/saymyname.toml declares for the whole project,
# and tests/project-planning-profile-test.py refuses a rig that differs.
human_approver = "benjamin-hurand"
