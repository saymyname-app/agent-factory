- id: T25
  kind: vertical_slice
  title: Accès iPhone guidé et fiabilité de l'accès
  blocked_by: [T17, T18, T13]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/cockpit-setup-wizard
    - tests/cockpit-setup-wizard-test.sh
    - lib/cockpit/access/**
    - lib/cockpit/ui/base/**
    - tests/cockpit-access-test.py
