  what_it_delivers: >-
    Benjamin met en place l'accès iPhone en suivant un assistant pas à pas qui vérifie chaque étape :
    achat de l'app Pushover, création de l'application sur pushover.net, fichier secret hors dépôt
    côté Windows (jamais dans git ni dans le chat), E2E ; compte Healthchecks.io, check « Usine muette
    » (période 5 min, grâce 10 min, notification « up » désactivée) et son intégration Pushover, avec
