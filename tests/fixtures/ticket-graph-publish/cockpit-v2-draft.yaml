  - "Une erreur se corrige par une nouvelle action tracée ; aucune trace n'est effacée ; le cockpit ne garde aucune copie locale de l'état des actions."
  - "Captures PC et iPhone, claires et sombres, jointes au PR et comparées à la variante D par le relecteur."
  - "La CI est verte."
