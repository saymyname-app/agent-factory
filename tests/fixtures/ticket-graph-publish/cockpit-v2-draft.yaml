  - "Un test montre la priorité des états superposés, « bloqué » seulement sur escalade Mayor-first ouverte ou convoi sans ticket prêt, en cours ni en PR (le silence seul n'est jamais un blocage), et le défaut d'un état sans cible."
  - "Un test montre les demandes Livré non Accepté et Accepté non Promu, les deux anomalies en santé, et l'historique avec la raison d'abandon ; il n'existe pas d'état Refusé."
  - "Captures PC et iPhone, claires et sombres, jointes au PR et comparées à la variante D par le relecteur."
