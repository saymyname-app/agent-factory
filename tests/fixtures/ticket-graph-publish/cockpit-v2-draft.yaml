- id: T17
  kind: vertical_slice
  title: Notifications iPhone par Pushover
  blocked_by: [T12, T13]
  target_rigs: [agent-factory]
  scope:
    paths:
    - lib/cockpit/notify/**
    - lib/cockpit/ui/notify/**
    - tests/cockpit-notify-test.py
    - tests/fixtures/cockpit/notify/**
  what_it_delivers: >-
    La politique de notification de la Spec, avec un seul adaptateur d'envoi (Pushover, E2E) :
    priorité 1 pour Urgent, 0 pour À faire, jamais pour Quand tu veux ; un seul push par demande
    (dédoublonnage persisté qui survit au redémarrage du cockpit), un nouveau seulement sur montée de
    niveau ou réapparition ; rappel toutes les 2 h pour une Urgent ni acquittée ni fermée ; un push à
    l'échéance d'un report au niveau d'origine ; un push de fin pour une Urgent résolue ; contenu
    limité à la phrase fixe du type, au projet, au lien du cockpit et au quoi tronqué ; plafond de 5
    pushes par heure puis un seul regroupé ; réessai en cas d'échec, « notification non livrée » sur
    la demande et « canal de notification en panne » en santé après 15 min. Secrets lus dans le
    fichier hors dépôt côté Windows ; journal des envois et bouton « envoyer une notification de test ».
  acceptance_criteria:
  - "Contre le faux adaptateur qui enregistre, un test montre priorités, un seul push par demande, et aucun doublon après un redémarrage du cockpit."
  - "Un test montre le rappel 2 h, son arrêt à l'acquittement, le push à l'échéance d'un report et le push de fin d'une Urgent."
  - "Un test montre le plafond de 5 par heure et le push regroupé « N autres demandes — voir le cockpit »."
  - "Un test montre réessai, « notification non livrée » et la ligne santé après 15 min d'échec."
  - "Un test montre qu'aucun push ne contient de donnée de personne réelle, de secret, de corps de bead ni de donnée produit."
  - "Un test montre qu'un fichier secret absent ou invalide apparaît en santé ; le journal des envois et le bouton de test fonctionnent ; aucune priorité 2 n'est jamais utilisée."
  - "La CI est verte."
- id: T18
