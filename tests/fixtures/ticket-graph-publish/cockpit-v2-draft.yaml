  what_it_delivers: >-
    Le pilote d'arrêt propre, bouton encore caché : un écran liste le travail en vol avant
    confirmation ; au clic, photo par store des beads ouverts et en cours, claims, convois, sessions
    et travail ; suspension de la cité par l'API gc ; suivi par session (ticket, étape, dernier signe
    de vie ; « orders en pause ») ; « Arrêtée proprement à HH:MM » quand la cité est suspendue et
    qu'aucune session agent ne vit, avec un bilan comparé à la photo. Après 30 min sans progression,
    une demande À faire « l'arrêt n'avance plus » propose un arrêt forcé en listant ce qui serait
    perdu ; l'arrêt forcé arrête les sessions en gardant leur bead et leur travail assigné. Pendant un
    arrêt demandé, les sources s'affichent « usine arrêtée par toi à HH:MM » ; le heartbeat se met en
    pause seulement à « Arrêtée proprement » ; un redémarrage du PC pendant l'arrêt donne « Arrêt
    interrompu » avec les écarts.
  acceptance_criteria:
  - "Sur un faux gc, un test montre la suite En marche, Arrêt en cours, Arrêtée proprement avec un bilan de 0 perte, et l'état persistant après un redémarrage du cockpit."
  - "Un test montre la demande « l'arrêt n'avance plus » après 30 min sans progression, jamais de bascule automatique vers l'arrêt forcé, et un arrêt forcé qui garde les beads assignés."
  - "Un test montre « usine arrêtée par toi » sans fausse alerte, la pause du heartbeat seulement à « Arrêtée proprement », et « Arrêt interrompu » avec ses écarts."
  - "Un test montre que le pilote ne lance jamais gc stop ni gc stop --force et ne touche que la cité."
  - "Le bouton d'arrêt n'est pas affiché ; le chemin est piloté par le test."
  - "La CI est verte."
