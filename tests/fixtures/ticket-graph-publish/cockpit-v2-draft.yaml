    HH:MM » au-dessus de tout, toutes valeurs grisées.
  acceptance_criteria:
  - "Un test pilote l'assistant sans interaction et montre qu'il n'écrit aucun secret hors du fichier prévu ni dans sa sortie, et qu'il refuse une configuration Serve avec Funnel ou vers l'API gc."
  - "Un test montre la demande À faire à J-14 de l'expiration de la clé Tailscale."
  - "Un test montre le bandeau « Déconnecté du cockpit depuis HH:MM » et les valeurs grisées quand la page ne reçoit plus de mise à jour."
  - "La doc d'exploitation décrit l'accès par Tailscale Serve vers le cockpit et plus aucune exposition de l'API gc."
  - "Captures PC et iPhone, claires et sombres, jointes au PR et comparées à la variante D par le relecteur."
  - "La CI est verte."

