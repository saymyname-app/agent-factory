# Copie figée de la description du brouillon de graphe du Cockpit V2 (bead af-i67vl0,
# digest approuvé sha256:c4edfe824110f072ddfa4af53be5bb888e880ad01008d63370c8e41346f68a88, 2026-09-30).
# Entrée du test tests/ticket-graph-publish-entry-contract-test.py, qui la redéclare au
# contrat du nouveau flux : la porte de publication doit la refuser ticket par ticket.
# Brouillon de graphe de tickets — C01 : Cockpit V2 de l'usine
# Spec approuvée af-oohx2x (carte af-arlph5), découpée par /to-tickets (mattpocock/skills c55ee46) le 2026-09-30.
source:
  spec: af-oohx2x
  spec_digest: sha256:eb0208f42a0c18efe748d4283dc7f936aa2d3bebba4e542be259709a6e011637
  planning_map: af-arlph5
  planning_run_target: C01
decisions_to_tickets:
  - intent: "« les vérifications visuelles ne sont présentes que pendant la plannification lors des prototypes de wayfinder, pas lors de l'implementation qui doit être autonome » (Benjamin, chat /to-tickets, 2026-09-30)"
    mechanism: "Aucune retenue humaine sur les PR d'écran. Le worker joint des captures PC et iPhone, le relecteur indépendant les compare à la variante D. Le jugement de Benjamin sur les captures (Spec, « hors test automatique ») se fait pendant les 7 jours d'usage réel qui clôturent C01, pas ticket par ticket. Le prototype de la page projet (T21) reste une validation par Benjamin, parce que c'est un prototype."
  - intent: "« 1-3 ok, story 20 hors V1 » (Benjamin, chat /to-tickets, 2026-09-30)"
    mechanism: "(1) Cinq fusions : 25 tickets. (2) La roadmap structurée du dépôt de connaissance SayMyName est faite hors graphe par une session opérateur une fois T03 fusionné ; ce dépôt n'est pas un rig. (3) Les trois corrections usine préalables à l'arrêt propre (T08, T09, T10) n'ont pas d'ordre entre elles et bloquent seulement T24. La story 20 (nouveauté d'une Spec par rapport à la carte) est hors V1."
out_of_graph:
  - "Session opérateur, dépôt Say-my-name-product, une fois T03 fusionné : roadmap.toml SayMyName au format de T03 (étapes B et C), roadmap.md qui cite les ids, retrait de A1–A7 (garder « B1 attend l'étape usine X »), retrait du rituel architecture:factory de rituals.md."
  - "Benjamin, pendant la livraison : revue et fusion du PR retenu de T04 (projets réels) ; choix de variante de T21."
  - "Benjamin, après la livraison : lancer l'assistant de T25 ; essai réel d'arrêt propre et de redémarrage (mode essai de T24)."
  - "Clôture de C01 (Spec, point 3 et 4) : 7 jours consécutifs d'usage réel conformes, puis la session qui clôt C01 retire le paragraphe des alertes intérimaires du AGENTS.md de SayMyName."
global_execution_contract:
  context: "Chaque ticket reçoit un contexte neuf et la Spec approuvée af-oohx2x (bd show af-oohx2x), en particulier Implementation Decisions et Testing Decisions ; le prototype de l'accueil (variante D) est sur la branche prototype/c01-home-screen, dossier prototypes/c01-home-screen/ ; le vocabulaire vient de CONTEXT.md."
  test_method: "Petits cycles rouge puis vert sur une interface publique : le cockpit est testé en démarrant son processus sur des sources simulées (faux gc avec API et SSE, faux bd, faux gh, faux clone git, horloge simulée, faux adaptateur Pushover qui enregistre, faux heartbeat) ; une porte est testée par sa ligne de commande contre le faux bd. Aucun test n'appelle une fonction interne ni n'atteint la cité live, Pushover ou Healthchecks.io. La batterie de l'usine tourne en CI à chaque tranche."
  visual_check: "Tout ticket qui change un écran joint au PR des captures PC (1440 px) et iPhone (390 px), en clair et en sombre ; le relecteur indépendant les compare à la variante D (pour la page projet : à la variante choisie en T21). Aucune validation humaine pendant l'implémentation."
  language: "Tout texte visible à l'écran ou dans un push est en français (Operator Language), sans identifiant ni terme interne hors du Cockpit Lexicon ; le Maire n'est jamais nommé à l'écran."
  review: "Un relecteur indépendant vérifie pour chaque tranche la fidélité à la Spec et la qualité de conception."
  readiness: "Un bloqueur n'est levé qu'une fois ses vérifications et sa revue passées et son code fusionné sur main."
  declared_scope: "Chaque ticket déclare dans ses chemins de scope (métadonnées, pas le texte du ticket) les fichiers qu'il compte toucher. Toucher un fichier hors scope n'est permis que noté dans le ticket avec la raison."
  repair: "La réparation technique reste dans le ticket ; un changement de comportement ou de topologie lève une Planning Exception."
  safety: "Pas de production, d'envoi réel, de publication externe, de dépense, de destruction irrécupérable ni d'accès élargi à des données personnelles sans autorité humaine explicite ; rien n'est édité dans la racine live ; aucun test n'atteint la cité live ; aucune donnée de personne réelle dans le code, les fixtures ou les captures ; aucun secret dans git ; l'API du superviseur gc n'est jamais exposée hors de localhost ; jamais gc stop --force."
tickets:
- id: T01
  kind: prefactor
  title: Glossaire du cockpit et langue de l'opérateur
  blocked_by: []
  target_rigs: [agent-factory]
  scope:
    paths:
    - CONTEXT.md
    - config/operator.toml
    - bin/operator-config
    - tests/operator-config-test.py
  what_it_delivers: >-
    Le glossaire de l'usine porte le vocabulaire du cockpit, et la langue de l'opérateur devient une
    donnée lisible par le code, pour que les producteurs et le cockpit n'aient qu'un vocabulaire et
    une langue.
  acceptance_criteria:
  - "CONTEXT.md définit Chantier (canonique Outcome : un Planning Run et son convoi), Operator Language, Cockpit Lexicon, Operator Action, fichier de rig, Projet (un rig appartient à un seul projet) et Roadmap Step, et ajoute l'alias « descripteur de projet » à Project Planning Profile."
  - "Le Cockpit Lexicon liste, en alias marqués « visibles dans le cockpit », usine, projet, agent, ticket, PR, tests automatiques (CI), Spec, carte de planification, graphe de tickets, proposition, rituel, décision."
  - "operator.toml porte language = fr ; un outil partagé pur code le lit et échoue avec un message clair si le champ manque ou est vide ; un test le pilote par sa ligne de commande."
  - "La CI est verte."
- id: T02
  kind: prefactor
  title: pr-autopilot ne fusionne jamais seul l'ajout ou le retrait d'un projet
  blocked_by: []
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/pr-autopilot
    - tests/pr-autopilot-project-hold-test.sh
  what_it_delivers: >-
    Un PR qui ajoute ou retire un descripteur de projet (dossier config/project-descriptors/) reste
    ouvert pour Benjamin, qui le fusionne lui-même, par exception à la fusion automatique de la
    maintenance usine ; la retenue est étiquetée et expliquée une fois sur le PR, comme la retenue
    de réversibilité existante.
  acceptance_criteria:
  - "Un test montre qu'un PR vert qui ajoute un descripteur de projet est retenu, étiqueté et expliqué une seule fois, et jamais fusionné."
  - "Un test montre la même chose pour un PR qui retire un descripteur de projet."
  - "Un test montre qu'un PR qui modifie seulement un descripteur existant, ou qui ne touche aucun descripteur, suit le chemin habituel."
  - "Les tests existants de pr-autopilot passent sans changement."
  - "La CI est verte."
- id: T03
  kind: vertical_slice
  title: Roadmap structurée de l'usine et ses rituels
  blocked_by: [T01]
  target_rigs: [agent-factory]
  scope:
    paths:
    - docs/roadmap.toml
    - docs/ROADMAP.md
    - docs/rituals.toml
    - bin/project-roadmap
    - bin/rituals-status
    - tests/project-roadmap-test.py
    - tests/rituals-status-test.py
  what_it_delivers: >-
    Une roadmap se lit sans interpréter de prose : un format structuré (id, titre, fini quand, ordre,
    statut à faire / en cours / fait) vérifié par un outil pur code, et la première roadmap à ce
    format, celle de l'usine, qui reprend les étapes A1–A7 aujourd'hui dans la roadmap SayMyName.
    Les rituels de l'usine déménagent avec elle, avec un statut lisible par le code.
  acceptance_criteria:
  - "Un test montre que l'outil de roadmap accepte une roadmap valide et refuse un champ manquant, un id en double, un ordre en double et un statut inconnu, avec un message qui nomme l'étape fautive."
  - "La roadmap de l'usine contient ses étapes (A1–A7 et C01 avec leur statut réel du 2026-09-30, repris de la roadmap SayMyName sur origin), et ROADMAP.md garde l'intention en citant les ids."
  - "planning_run_target peut désigner l'id d'une Roadmap Step : l'outil le vérifie pour une valeur donnée."
  - "Le rituel architecture:factory (seuil de PR fusionnés depuis une date de base, pause possible jusqu'à un événement) est défini côté usine ; un outil pur code sort son statut (dû, ok, en pause) en JSON ; un test le pilote contre un faux gh."
  - "La CI est verte."
- id: T04
  kind: vertical_slice
  title: Descripteur de projet étendu, un rig = un projet
  blocked_by: [T01, T02, T03]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/project-planning-profile
    - lib/project_registry.sh
    - config/project-descriptors/**
    - tests/project-planning-profile-test.py
    - tests/project-registry-test.sh
    - tests/fixtures/project-planning-profile/**
    - docs/PROJECT_PLANNING_PROFILE.md
  what_it_delivers: >-
    Tout projet est déclaré à l'usine par son descripteur (Project Planning Profile étendu) et
    l'usine ne nomme aucun projet dans son code : project_id (clé projet), nom affiché en français,
    rigs, pointeur vers le dépôt de connaissance, chemin de la roadmap structurée, commande de statut
    des rituels, branche de promotion par rig (optionnelle). Les fichiers de config/projects restent
    des fichiers de rig. Les descripteurs réels de l'usine et de SayMyName arrivent dans un PR que
    T02 retient pour Benjamin.
  acceptance_criteria:
  - "Un test montre qu'un descripteur valide est accepté et qu'un champ obligatoire manquant ou une branche de promotion vers un rig non déclaré est refusé ; aucun champ de production ni de langue n'existe."
  - "Un test montre que le contrôle du registre refuse un rig sans projet et un rig déclaré dans deux projets, et que ce contrôle tourne en CI."
  - "L'outil liste les projets déclarés et sort un descripteur en JSON ; human-approver continue de répondre comme avant."
  - "Descripteur agent-factory : rig agent-factory, pas de branche de promotion, sa roadmap et son statut de rituels de T03. Descripteur saymyname : rigs saymyname-backend et saymyname-frontend avec promotion dev vers main, dépôt de connaissance saymyname-app/Say-my-name-product, roadmap knowledge/roadmap.toml, rituels tools/rituals-status.sh."
  - "La CI est verte."
- id: T05
  kind: vertical_slice
  title: Clé projet de la carte au convoi, titre d'affichage du graphe
  blocked_by: [T04, T06]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/planning-map
    - bin/spec-approve
    - bin/ticket-graph-publish
    - tests/planning-map-test.py
    - tests/spec-approve-test.py
    - tests/ticket-graph-publish-test.py
    - tests/fixtures/planning-map/**
    - tests/fixtures/spec-approve/**
    - docs/agents/issue-tracker.md
    - docs/PLANNING_MAP.md
    - docs/PLANNING_RUN.md
  what_it_delivers: >-
    Chaque chantier est rattaché à un projet sans deviner : la carte reçoit la clé projet à sa
    création (nouvelle commande de création de carte, qui refuse un projet non déclaré), la Spec et
    le brouillon de graphe en héritent, ticket-graph-publish la propage au convoi et exige un titre
    d'affichage dans la langue de l'opérateur. Les cartes encore ouvertes sont rétro-remplies. La
    remontée à Benjamin d'un reslice refusé passe par les champs obligatoires de T06.
  acceptance_criteria:
  - "Un test montre que la création de carte pose la clé projet et refuse un projet absent des descripteurs ; la doc du tracker utilise cette commande au lieu du bd create brut."
  - "Un test montre que spec-approve pose sur la Spec la clé de sa carte et refuse une Spec dont la clé contredit celle de sa carte ; une Spec sans carte garde sa propre clé."
  - "Un test montre que bd-publish refuse un brouillon sans clé ou sans titre d'affichage, ou dont la langue déclarée n'est pas l'Operator Language, et que le convoi publié porte la clé projet."
  - "Un test montre que la remontée d'un reslice refusé fournit quoi, pourquoi, que faire et des options avec conséquence."
  - "Une commande de rétro-remplissage, testée, pose la clé sur les seules cartes ouvertes ; elle a été lancée une fois sur les cartes ouvertes et son résultat est noté dans le ticket."
  - "La CI est verte."
- id: T06
  kind: vertical_slice
  title: escalation-door refuse une demande incompréhensible et enregistre la réponse
  blocked_by: [T01]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/escalation-door
    - tests/escalation-door-test.sh
    - tests/fixtures/escalation-door/**
    - bin/factory-guard
    - bin/provider-failover
    - agents/mayor/prompt.template.md
  what_it_delivers: >-
    Une demande de décision à Benjamin est compréhensible sans agent et sa réponse est enregistrée :
    la commande benjamin refuse l'écriture sans quoi / pourquoi / que faire, sans options (chacune
    avec sa conséquence, au plus une « Recommandé » avec sa raison), sans horodatage, sans drapeau
    bloquant éventuel ou dans une autre langue que l'Operator Language ; une nouvelle commande
    répondre écrit l'option choisie sur le bead, efface le NEEDS BENJAMIN et réveille le Maire avec
    la réponse. Tous les appelants actuels fournissent ces champs.
  acceptance_criteria:
  - "Un test par refus (champ manquant, ligne de plus de 140 caractères, option sans conséquence, deux « Recommandé », recommandation sans raison, langue différente) montre que le bead reste intact."
  - "Un test montre qu'une demande complète est écrite sur le bead avec ses champs, son horodatage et son drapeau bloquant, et que list l'affiche comme avant."
  - "Un test montre que répondre écrit l'option choisie (commentaire et métadonnée : option, quand, acteur), efface le NEEDS BENJAMIN et réveille le Maire avec « Benjamin a répondu b sur … », et refuse une option inconnue."
  - "factory-guard, provider-failover et le prompt du Maire fournissent les champs, avec des phrases fixes en français pour les événements machine ; leurs tests passent."
  - "Une escalade Mayor-first promue par sweep garde ses champs s'ils existent ; sinon elle reste une demande incomplète, sans échec."
  - "La CI est verte."
- id: T07
  kind: vertical_slice
  title: Propositions compréhensibles, acceptées ou rejetées avec raison
  blocked_by: [T06]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/proposal-door
    - tests/proposal-door-test.py
    - bin/overlap-conflict-log
    - lib/overlap_conflict_log.py
    - tests/overlap-conflict-log-test.py
    - bin/upstream-skills-check
    - tests/upstream-skills-check-test.sh
    - agents/mayor/prompt.template.md
    - bin/escalation-door
  what_it_delivers: >-
    Une porte unique de proposition crée une proposition seulement avec les mêmes champs
    obligatoires que les demandes (dans l'Operator Language), et la fait passer d'un état à l'autre :
    accepter (vers « à planifier »), rejeter avec une raison obligatoire, reporter. Les trois
    producteurs actuels (journal des conflits de recouvrement, contrôle des skills amont, Maire)
    passent par elle.
  acceptance_criteria:
  - "Un test montre qu'une proposition sans ses champs est refusée et qu'une proposition complète est créée avec le label proposal."
  - "Un test montre accepter (état « à planifier »), rejeter sans raison refusé, rejeter avec raison, reporter jusqu'à une heure, chacun tracé sur le bead (commentaire et métadonnée, acteur)."
  - "Le compteur de propositions en attente ne compte plus les propositions acceptées ou rejetées."
  - "Les trois producteurs utilisent la porte ; leurs tests passent ; les propositions existantes sans champs restent lisibles sans réécriture."
  - "La CI est verte."
- id: T08
  kind: vertical_slice
  title: Un worker s'arrête quand la cité est suspendue
  blocked_by: []
  target_rigs: [agent-factory]
  scope:
    paths:
    - agents/factory-worker/**
    - tests/factory-worker-suspended-test.sh
  what_it_delivers: >-
    Quand la cité est suspendue, un worker termine son ticket en cours (PR ouverte, travail libéré)
    puis met fin à sa session, au lieu de reboucler sur CLAIM_REJECTED ; un worker sans ticket
    s'arrête tout de suite.
  acceptance_criteria:
  - "Un test montre qu'un worker sans ticket, face à une cité suspendue, met fin à sa session sans nouvelle tentative de claim."
  - "Un test montre qu'un worker avec un ticket en cours le termine (PR ouverte) avant de s'arrêter."
  - "Hors suspension, un refus de claim se comporte comme avant."
  - "La CI est verte."
- id: T09
  kind: vertical_slice
  title: Pas de réattribution après un arrêt volontaire
  blocked_by: []
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/on-session-stranded
    - bin/factory-orphan-sweep
    - tests/on-session-stranded-test.sh
    - tests/factory-orphan-sweep-order-test.sh
  what_it_delivers: >-
    Le travail d'une session arrêtée pendant une suspension de la cité reste assigné à cette session :
    ni on-session-stranded ni le balayage des orphelins ne le rouvrent ni ne le réattribuent, pour
    qu'elle le reprenne au redémarrage.
  acceptance_criteria:
  - "Un test montre qu'une session échouée pendant une suspension ne fait rouvrir ni signaler aucun de ses beads."
  - "Un test montre que le balayage des orphelins garde les claims d'une session arrêtée pendant une suspension."
  - "Hors suspension, les deux outils se comportent comme avant."
  - "La CI est verte."
- id: T10
  kind: vertical_slice
  title: Orders étalés au redémarrage
  blocked_by: []
  target_rigs: [agent-factory]
  scope:
    paths:
    - orders/**
    - city.toml
    - tests/orders-validate-test.sh
    - tests/orders-restart-stagger-test.sh
  what_it_delivers: >-
    Après un gc resume, les orders dus reprennent étalés dans le temps au lieu de partir en rafale,
    sans en sauter aucun ; leur cadence normale ne change pas.
  acceptance_criteria:
  - "Un test montre qu'après une reprise les premières exécutions des orders dus sont étalées (pas de rafale dans la première minute) et qu'aucun n'est sauté."
  - "Un test montre que la cadence hors reprise est inchangée."
  - "La validation des orders passe."
  - "La CI est verte."
- id: T11
  kind: vertical_slice
  title: Cockpit, modèle de lecture et fraîcheur, démarré avec l'usine
  blocked_by: [T01]
  target_rigs: [agent-factory]
  scope:
    paths:
    - bin/cockpit
    - lib/cockpit/core/**
    - lib/cockpit/ui/base/**
    - tests/cockpit-core-test.py
    - tests/fixtures/cockpit/core/**
    - bin/factory-boot
    - docs/COCKPIT.md
  what_it_delivers: >-
    Le cockpit existe : un processus pur code dans WSL, séparé de gc, qui écoute 127.0.0.1 seulement,
    tient une copie à jour (abonnement SSE à l'API du superviseur gc, lectures Beads) où chaque valeur
    porte sa valeur, son heure de lecture, sa source et sa Freshness (à jour, périmée, inconnue, selon
    les Validity windows gc 2 min, Beads 5 min, GitHub 10 min, rituels 1 h). La page lit cette copie
    et affiche en tête « Tout est à jour à HH:MM (Paris) » ou les sections périmées ou inconnues, sur
    la base visuelle de la variante D. Le démarrage de l'usine lance le cockpit s'il ne tourne pas. Ce
    ticket construit le seam de test principal du cockpit.
  acceptance_criteria:
  - "Le test démarre le processus sur un faux gc (API et SSE), un faux bd et une horloge simulée, et lit ce que la page reçoit."
  - "Un test montre le passage à jour, périmée puis inconnue au fil de l'horloge, et qu'aucune valeur n'est affichée « 0 » sans lecture fraîche ; une réponse gc partial: true n'est pas prise pour complète."
  - "Un test montre la ligne de tête « Tout est à jour à HH:MM (Paris) » et, quand une source ne répond plus, la liste des sections périmées ou inconnues."
  - "Le processus refuse d'écouter ailleurs que sur 127.0.0.1 ; il survit à une suspension et à un arrêt de la cité simulés."
  - "Un test montre que le démarrage de l'usine lance le cockpit s'il ne tourne pas, et ne lance pas un second processus s'il tourne déjà."
  - "Captures PC et iPhone, claires et sombres, jointes au PR et comparées à la variante D par le relecteur."
  - "La CI est verte."
- id: T12
  kind: vertical_slice
  title: « Ce qui t'attend » avec les NEEDS BENJAMIN et les propositions
  blocked_by: [T11, T06, T07]
  target_rigs: [agent-factory]
  scope:
    paths:
    - lib/cockpit/requests/**
    - lib/cockpit/text/**
    - lib/cockpit/ui/home/**
    - tests/cockpit-requests-test.py
    - tests/fixtures/cockpit/requests/**
  what_it_delivers: >-
    L'accueil montre « Ce qui t'attend » : les Demandes opérateur typées venant des NEEDS BENJAMIN (À
    faire, ou Urgent si l'émetteur les marque bloquantes pour une livraison en cours) et des
    propositions ouvertes (Quand tu veux), triées Urgent d'abord puis de la plus ancienne à la plus
    récente. Chaque demande montre Quoi, Pourquoi ça t'attend, Que faire, ses options avec leur
    conséquence et au plus une « Recommandé », son projet, depuis quand et quand elle a été vérifiée,
    et des détails repliés. Une demande sans ses champs s'affiche avec « incomplète : champ X
    manquant » et le repli fixe. Le texte principal est contrôlé en test et à l'exécution.
  acceptance_criteria:
  - "Un test montre les niveaux, le tri, les champs, le projet (inconnu donne « usine »), depuis quand et vérifié à."
  - "Un test montre qu'une demande sans champ s'affiche avec « incomplète : champ X manquant », les phrases de repli fixes de la Spec et « continuer avec un agent », et qu'un défaut du producteur est compté ; les propositions existantes sans champs s'affichent ainsi."
  - "Un test montre « Rien ne t'attend — vérifié à HH:MM » quand la liste est vide et « Inconnu : illisible depuis HH:MM » quand la source ne répond pas."
  - "Un test montre qu'une demande ne sort qu'à la fermeture de sa condition à la source."
  - "Un test montre que le contrôle du texte principal refuse un identifiant, un terme interne hors lexique, une ligne de plus de 140 caractères ou un champ absent, et qu'à l'exécution un échec donne le repli et un défaut compté."
  - "Les escalades Mayor-first non promues n'apparaissent pas dans « Ce qui t'attend »."
  - "Captures PC et iPhone, claires et sombres, jointes au PR et comparées à la variante D par le relecteur."
  - "La CI est verte."
- id: T13
  kind: vertical_slice
  title: Acquitter, reporter, continuer avec un agent
  blocked_by: [T12]
  target_rigs: [agent-factory]
  scope:
    paths:
    - lib/cockpit/actions/**
    - lib/cockpit/access/**
    - lib/cockpit/ui/actions/**
    - tests/cockpit-actions-test.py
    - tests/fixtures/cockpit/actions/**
  what_it_delivers: >-
    Premières Operator Actions, avec toute la sécurité d'action : POST seulement, vérification de
    l'Origin, cookie SameSite, et exécution seulement si l'en-tête Tailscale-User-Login égale le
    login de Benjamin lu dans le fichier hors dépôt côté Windows (sinon lecture seule). Acquitter une
    Urgent (plus de rappel, elle reste listée), reporter une Urgent ou une À faire (1 h, 4 h, demain
    09:00, heure libre ; une Urgent reportée reste visible grisée), copier le prompt neutre «
    continuer avec un agent » marqué « utilise un agent (consomme des tokens) ». Un tap et « Annuler »
    pendant 10 s. Chaque action est tracée sur sa source (bead journal pour une source sans bead) et
    le PC et l'iPhone lisent le même état depuis ces traces.
  acceptance_criteria:
  - "Un test montre qu'une action sans l'en-tête, avec un autre login, en GET ou avec une mauvaise Origin est refusée sans rien écrire, et que la page reste lisible."
  - "Un test montre qu'acquitter et reporter laissent sur le bead source un commentaire et une métadonnée (quoi, sur quoi, option ou raison, quand, acteur benjamin/cockpit) et qu'une source sans bead reçoit un bead journal."
  - "Un test montre qu'une demande reportée revient à l'échéance, qu'une Urgent reportée reste visible grisée, et qu'« Annuler » dans les 10 s n'écrit rien."
  - "La phrase fixe « Acquitter : plus aucun rappel, la demande reste ici. Reporter : cachée jusqu'à l'heure choisie, puis elle revient. Aucun des deux ne change rien dans l'usine. » est affichée."
