  what_it_delivers: >-
    La zone santé montre ce que l'usine traite elle-même et ce qui la menace, en phrases fixes :
    « l'usine tourne une version en retard de N commits » quand la racine live est derrière
    origin/main, une alerte quand le superviseur gc est injoignable plus de 5 min, « usine à l'arrêt ? »
    après 60 min sans progression alors que du travail de livraison est prêt, les escalades
    Mayor-first non promues (« l'usine essaie de corriger seule depuis 1 h 40 »), les boucles, les
