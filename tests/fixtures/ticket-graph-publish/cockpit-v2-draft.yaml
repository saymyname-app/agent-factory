    Un chantier se suit jusqu'à la production : Benjamin accepte un chantier Livré d'un clic en deux
    temps (Operator Action tracée) ou copie « Pas bon → agent » ; l'étape Promu est vraie quand tous
    les commits de merge du convoi sont atteignables depuis la branche de promotion, et masquée quand
    le rig n'en a pas ; chaque projet montre « dev a N commits d'avance ». Les états superposés « à toi
    de jouer », « problème remonté » et « bloqué » s'affichent avec leur cible d'action (un état sans
    cible est un défaut affiché) ; Livré non Accepté et Accepté non Promu sont des demandes Quand tu
