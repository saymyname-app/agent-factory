# Factory-side rituals (GLOSSARY.md: rituel -- proposed to Benjamin, run by
# him, when he wants; agents never run these on their own). Read with
# `bin/rituals-status`, which never runs a ritual -- only reports its status.
#
# `architecture:factory` moved here with the Factory's own roadmap
# (`docs/roadmap.toml`, T03 af-s0qa19) out of SayMyName's `knowledge/
# rituals.md` on origin (repo saymyname-app/Say-my-name-product); that file
# keeps the `architecture:back` and `architecture:front` rows (SayMyName's
# own rigs) plus the operator-level `incidents` and `alignment` rituals,
# which are cross-project and stay there.
#
# kind = "pr_threshold": due once at least `threshold` PRs have merged into
# `base_branch` of `repo` since `last_done` (an ISO 8601 UTC timestamp), or
# the literal string "paused" -- while paused, status is always "paused"
# until an operator edits `last_done` to a real timestamp (normal commit).
# `paused_reason` and `resume_when` are shown as written on the cockpit's
# Rituels page: write them in French, for Benjamin.

[[ritual]]
id = "architecture:factory"
kind = "pr_threshold"
repo = "saymyname-app/agent-factory"
base_branch = "main"
threshold = 20
last_done = "paused"
paused_reason = "reportée le 29/09/2026 (décision 22), les 64 PR depuis la dernière revue étant du remaniement des étapes A4 à A6"
resume_when = "à la clôture de l’étape A6 de la feuille de route (docs/roadmap.toml), dont la date deviendra le nouveau point de départ"
