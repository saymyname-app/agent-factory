# The Software Factory's own Roadmap (GLOSSARY.md: Project, Roadmap Step).
#
# Structured so the Cockpit and any tool read the current step without
# interpreting prose -- validate with `bin/project-roadmap validate` and
# resolve a `planning_run_target` with `bin/project-roadmap check-target`.
# Status changes by normal commit. `docs/ROADMAP.md` keeps the human-readable
# intent and cites these same ids.
#
# Migrated 2026-09-30 (T03, af-s0qa19) from SayMyName's own roadmap
# (`knowledge/roadmap.md` / `knowledge/state.md` on origin, repo
# saymyname-app/Say-my-name-product): steps A1-A6 and the step SayMyName's
# roadmap called A7 -- "Planning Run C01 'Cockpit V2'" -- which keeps its
# real id here, C01, because that is the id every Spec, ticket and convoy
# already uses as `planning_run_target`. A1-A7 leave the SayMyName roadmap;
# SayMyName's roadmap.md keeps only "B1 attend l'étape usine X" (out of this
# ticket's graph -- a SayMyName-side operator step after T03 merges).
#
# Statuses below are the real statuses as of 2026-09-30, read from
# knowledge/state.md on origin (the "Roadmap position" section), then read
# again from the tracker on 2026-10-21 (E, af-8rbceu: the cockpit flags a
# step "in_progress" whose chantier is closed): A5's convoy af-ly65d closed
# 2026-09-28, A6's af-dsygc 2026-09-30 (closing note #343), C01's graph
# convoy af-f71cgu 2026-10-01 and D01's af-wtjo2x 2026-10-11 -- all "done"
# then; D01 since back "in_progress" (below).
# The cockpit's work goes on as C01-suite (Spec af-fgcw0d, convoy af-strhoy),
# after the abandon of C01-reprise (Spec af-2zseit, convoy af-pqfxmd).
#
# D01 is back "in_progress" (R5, af-3r1tmr; Benjamin, 2026-10-25 15:37 Paris,
# « Ok pour tes recommandations » on « D01 : le remettre « en cours » »): its
# end condition requires "Cockpit V2 redelivered through the new flow", the
# step C01-suite, still in progress -- declared in `done_requires`, so the
# cockpit flags D01 if it is said done before C01-suite. The final
# verification Benjamin judges stays in the prose of `done_when`.

