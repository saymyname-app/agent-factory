# interpreting prose -- validate with `bin/project-roadmap validate` and
# resolve a `planning_run_target` with `bin/project-roadmap check-target`.
# Status changes by normal commit. `docs/ROADMAP.md` keeps the human-readable
# intent and cites these same ids.
