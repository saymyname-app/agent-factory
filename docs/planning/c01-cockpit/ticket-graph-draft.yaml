- id: K18
  kind: prefactor
  title: Any ticket that renders UI needs an approved prototype and screenshots (all projects)
  display_title: Tout ticket d'interface exige une maquette validée et des captures (tous projets)
  blocked_by:
  - K13
  target_rigs:
  - agent-factory
  scope:
    paths:
    - bin/ticket-graph-publish
    - tests/ticket-graph-publish*
    - docs/PLANNING_RUN_ROUTER.md
    - docs/UI_GATE.md
  what_it_delivers: >-
    A ticket may declare `renders_ui: true`; ticket-graph-publish refuses (validate, publish and
    patch) a draft in which such a ticket has no ticket of kind `prototype` among its transitive
    blockers, with an operator-readable reason, and stores gc.renders_ui on the published bead.
    docs/UI_GATE.md states the rule for every project: the prototype is approved by the operator
    before UI tickets start; each UI PR carries phone-width and desktop-width screenshots from
    synthetic data; the reviewer compares them with the approved prototype and escalates visible
    deviations. The planning docs tell the to-tickets step to mark UI tickets and add the prototype
    ticket. Files: see scope.
  acceptance_criteria:
  - "Test: a draft with a `renders_ui` ticket and no prototype ancestor is refused; with one, it publishes and the bead carries gc.renders_ui."
  - "Test: drafts without `renders_ui` publish unchanged."
  - "docs/UI_GATE.md is linked from the planning docs and names the reviewer's check."
