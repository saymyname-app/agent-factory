  id: ticket-graph-draft-agent-factory-project-agnostic-refactor
  state: APPROVED_TICKET_GRAPH_DRAFT
  approved_by: Benjamin
  approved_at: 2026-09-23
  content_digest: sha256:53a663ab5841e8e43dd05f5a4c470496ce50613b3b9690b5102df881c83be417
  digest_scope: UTF-8 bytes from the legacy_boundary key through end of file, with LF line endings
  source_spec:
    id: spec-agent-factory-project-agnostic-refactor
    state: APPROVED_SPEC
    digest: sha256:9ce47e19172505d26fd7d0ba8696bad29896e7614b0dc5c15a2f19061064b9fa
  method_baseline:
    skill: Matt Pocock /to-tickets
