description = """
Default Gas City implementation of build-base.

This concrete workflow uses the built-in Gas City requirement, design review,
decomposition, implementation, review, and publish helpers while preserving the
same full-lifecycle stage contract exposed by build-base.

Local fork (2026-09-20, af-9ce3q): `decompose`'s instructions told the
decomposer to create work-item beads and link them into one implementation
convoy for the `implement` drain, with no guidance on ordering. Under
`drain_policy=separate` (the default) every convoy item gets its own isolated
worktree and starts as soon as it is `bd ready` -- so an item whose job is to
gather evidence or verify other items' combined output started in parallel
with its prerequisites, with nothing from them committed yet. Live incident:
smb-ugkm/smb-gjts -- item 5 ("Evidence run and P0 escalation path") genuinely
depended on items 1-4, got its own worktree in parallel with no merged output
to verify against, and the worker correctly refused to fabricate a green run
and closed fail rather than weaken the check. `decompose` now instructs
wiring an explicit `bd dep <prereq> --blocks <dependent>` edge for any item
that needs another item's completed output before creating the convoy --
`bd ready`/dispatch is already blocker-aware, so a dependent item is not
offered to a worker until its prerequisites close. Genuinely independent
items are unaffected and keep draining in parallel under
`drain_policy=separate`.

Local fail-fast envelope (2026-09-21, af-jz8kc): graph dependencies become
ready when their blocker closes, regardless of whether it closed pass or fail.
The top-level build stages therefore run inside the `build-pipeline` scope and
opt into `gc.on_fail=abort_scope`. A hard gate/control failure now closes the
scope fail and marks every later build stage skipped before a worker can claim
it; the workflow finalizer then closes the root fail from the scope outcome.
This uses Gas City's existing scope contract and does not fork controller code.

Local shared-worktree adapter (2026-09-21, af-5z6p7): Gas City's shared drain
serializes `do-work-item` children but intentionally does not create the
repository worktree those children require. `prepare-shared-worktree` now
creates one branch/worktree for the implementation convoy and records the same
authoritative `work_dir` on every source anchor before the first child can run.
The existing review and publish stages consume that shared branch; a teardown
step removes the clean worktree after the pipeline reaches terminal state.
`drain_policy=separate` still uses the upstream `do-work` lifecycle unchanged.
"""
formula = "build-basic"
version = 1
contract = "graph.v2"
extends = ["build-base"]
target_required = true

[catalog]
name = "build-basic"
description = "Run the default Gas City full-lifecycle build workflow from requirements through clean review and optional publish."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[[steps]]
id = "prepare"
title = "Prepare build context"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/prepare.md"

[[steps]]
id = "requirements"
title = "Generate requirements"
needs = ["prepare"]
metadata = { "gc.run_target" = "gc.requirements-planner", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/requirements.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan"
title = "Write implementation plan"
needs = ["requirements"]
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/plan.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Run design review"
needs = ["plan"]
metadata = { "gc.run_target" = "gc.review-synthesizer", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/plan-review.md"

[[steps]]
id = "decompose"
title = "Create task beads"
needs = ["plan-review"]
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/decompose.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "implement"
title = "Drain build implementation"
needs = ["decompose"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/implement.md"

[steps.drain]
context = "separate"
formula = "do-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Drain build implementation in one shared session"
needs = ["prepare-shared-worktree"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/implement-same-session.md"

[steps.drain]
context = "shared"
formula = "do-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true

[[steps]]
id = "prepare-shared-worktree"
title = "Prepare one authoritative shared implementation worktree"
needs = ["decompose"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/prepare-shared-worktree.md"

[[steps]]
id = "summarize-implementation"
title = "Write canonical implementation summary"
needs = ["implement", "implement-same-session"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.build.implementation_summary_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/summarize-implementation.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "review"
title = "Run starter implementation review"
needs = ["summarize-implementation"]
metadata = { "gc.run_target" = "gc.implementation-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
expand = "build-basic-review-scoped"
expand_vars = { implementation_target = "{{implementation_target}}" }
description_file = "../assets/workflows/build-basic/review.md"

[[steps]]
id = "finalize"
title = "Finalize build-basic"
needs = ["review"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/finalize.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "publish"
title = "Optionally publish build-basic"
needs = ["finalize"]
metadata = { "gc.run_target" = "gc.publisher", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/build-basic/publish.md"

[[steps]]
id = "build-pipeline"
title = "Finalize build pipeline scope"
needs = ["prepare", "requirements", "plan", "plan-review", "decompose", "implement", "prepare-shared-worktree", "implement-same-session", "summarize-implementation", "review", "finalize", "publish"]
description = "Terminal fail-fast scope for the complete build-basic pipeline. Gas City control beads close this scope with gc.outcome=fail when any member marked gc.on_fail=abort_scope fails; later members are closed skipped and must never be claimed."
metadata = { "gc.kind" = "scope", "gc.scope_name" = "build-pipeline", "gc.scope_role" = "body" }

[[steps]]
id = "cleanup-shared-worktree"
title = "Release the shared implementation worktree"
needs = ["build-pipeline"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "gc.run-operator", "gc.kind" = "cleanup", "gc.scope_ref" = "build-pipeline", "gc.scope_role" = "teardown" }
description_file = "../assets/workflows/build-basic/cleanup-shared-worktree.md"
