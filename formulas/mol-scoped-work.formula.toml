description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.

Local fork (2026-09-17, Factory audit F1/F2/F5): every step below closes
itself explicitly with `gc bd update --set-metadata gc.outcome=pass
--status=closed` (F1) — the upstream version relied on agents using `gc bd
close --reason`, which never sets `gc.outcome` and produced `missing_outcome`
-> `hard_fail` -> `abort_scope` on 7 of 8 runs (af-ptx7). `notify-failure`
escalates a failed body scope instead of leaving it silent in nested metadata
(F2). `submit` gives an explicit push + `gh pr create` instead of prose
examples, so a PR is guaranteed rather than merely suggested (F5).
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
# af-pl39t: claim it now -- dispatch is the only signal that a workflow is
# active against $WORK_BEAD_ID. Nothing else flips it off `open`, so the
# bead still reads as ready, unclaimed work and can be dispatched a second
# time while this workflow runs.
gc bd update "$WORK_BEAD_ID" --claim
gc bd show "$WORK_BEAD_ID"
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'
gc mail inbox
gc bd update load-context --set-metadata gc.outcome=pass --status=closed --notes "context loaded"
```
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.

```bash
gc bd update body --set-metadata gc.outcome=pass --status=closed --notes "body scope complete"
```
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "notify-failure"
title = "Escalate if the body scope failed"
needs = ["body"]
description = """
F2 (Factory audit): the body scope can close with a nested
`gc.outcome=fail` (set by the scope-check machinery on an aborted scope)
that nothing outside this formula ever reads — a silent failure. Runs
regardless of whether body passed or failed (like cleanup-worktree), and
escalates loudly only when it actually failed.

```bash
BODY_OUTCOME=$(gc bd show body --json | jq -r '.[0].metadata["gc.outcome"] // empty')
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"
if [ "$BODY_OUTCOME" = "fail" ]; then
  "$FACTORY_ROOT/bin/escalation-door" mayor "${WORK_BEAD_ID:-body}" \
    "mol-scoped-work body scope failed for ${WORK_BEAD_ID:-this convoy}" || exit 1
fi
gc bd update notify-failure --set-metadata gc.outcome=pass --status=closed --notes "checked body outcome: ${BODY_OUTCOME:-unknown}"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
  git worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
  gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
  WORKTREE="$WORKTREE_PATH"
fi
cd "$WORKTREE"
{{setup_command}}
gc bd update workspace-setup --set-metadata gc.outcome=pass --status=closed --notes "worktree ready"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
gc bd update preflight-tests --set-metadata gc.outcome=pass --status=closed --notes "preflight checks passed"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "implement"
title = "Implement the requested change"
needs = ["preflight-tests"]
description = """
Make the code changes for convoy `{{convoy_id}}` in the worktree. Commit focused changes
as needed and keep the branch scoped to this work.

When the change is committed, close this step explicitly:

```bash
gc bd update implement --set-metadata gc.outcome=pass --status=closed --notes "change implemented and committed"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "self-review"
title = "Review the diff and run verification"
needs = ["implement"]
description = """
Inspect the change and run verification commands.

```bash
git diff origin/{{base_branch}}...HEAD
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
git status
gc bd update self-review --set-metadata gc.outcome=pass --status=closed --notes "self-review passed"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "submit"
title = "Finalize the work item"
needs = ["self-review"]
description = """
Push the branch and open a PR. F5 (Factory audit): this used to be prose
examples only ("push the branch and hand off to a reviewer") with no
guaranteed PR; make it concrete.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BRANCH=$(git rev-parse --abbrev-ref HEAD)
if [ "$BRANCH" = "HEAD" ] || [ "$BRANCH" = "{{base_branch}}" ]; then
  BRANCH="scoped-work/$WORK_BEAD_ID"
  git checkout -b "$BRANCH"
fi
if [ "{{base_branch}}" = "main" ]; then
  echo "mol-scoped-work refuses to open a PR with base=main from a writer step; confirm this convoy actually targets a non-production branch" >&2
fi
git push -u origin "$BRANCH"
PR_URL=$(gh pr create --base "{{base_branch}}" --head "$BRANCH" \
  --title "<one-line summary of $WORK_BEAD_ID>" \
  --body "Closes $WORK_BEAD_ID.

<what changed and why>")
gc bd update "${WORK_BEAD_ID:-submit}" \
  --set-metadata "gc.pr_url=$PR_URL" \
  --set-metadata "gc.delivery_contract=pr-ci-merged-v1" \
  --set-metadata "gc.delivery_status=waiting" \
  --set-metadata "gc.work_branch=$BRANCH" \
  --set-metadata "gc.work_base_branch={{base_branch}}" >/dev/null 2>&1 || true
gc bd update submit --set-metadata gc.outcome=pass --status=closed --notes "opened $PR_URL against {{base_branch}}"
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Remove the temporary worktree after the body reaches terminal state.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
  git worktree remove --force "$WORKTREE" || rm -rf "$WORKTREE"
fi
gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
gc bd update cleanup-worktree --set-metadata gc.outcome=pass --status=closed --notes "worktree removed"
```
"""
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
