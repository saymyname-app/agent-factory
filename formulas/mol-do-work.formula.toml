description = """
Simple work formula — read the bead, do what it says, close it.

This is the minimal work lifecycle for coding agents. No refinery handoff.
The agent reads the bead's description and implements the solution. On a
rig whose current branch is not protected (see lib/protected_rigs.sh), that
means the current working directory, same as before — no git branching, no
worktree isolation.

This is the Mayor's default delivery formula (STANDARD tier) for
single-agent work. For multi-agent setups with worktree isolation, use mol-polecat-commit
instead (or mol-polecat-work from the gastown pack for full refinery
review).

Local fork (2026-09-17, Factory audit F4): "also mail Witness" was prose
with no concrete command, in the Factory's most-used formula (42 runs).
"Witness" is not a real recipient here (a single-operator Factory, not a
multi-agent Gastown pool) — an agent following it literally would mail a
nonexistent role. Made concrete: mail `${GC_ESCALATION_RECIPIENT:-human}`.

Local fork (2026-09-18, af-ogg8z): this formula used to hand a worker the
live agent-factory root as its cwd with no isolation at all -- the same
class of mistake the Mayor made minutes earlier the same night (committing
directly in the live root). A worker literally did it: af-lb3q was
committed straight into the live root, no branch, no PR. `workspace-setup`
and `push-and-pr` now isolate work on the HQ rig in a worktree via
`bin/factory-do-work-workspace`, which is a documented no-op everywhere
else -- other rigs keep the exact behavior this formula always had.

Local fork (2026-09-24, af-09hxz): "other rigs keep the exact behavior this
formula always had" turned out to include committing straight to a product
rig's protected `dev` branch, no branch, no PR -- pr-autopilot's auto-merge
CI gate never saw the change. Live near-miss: smb-u3zzt (dispatched via
`gc sling saymyname-backend/gc.implementation-worker ... --on mol-do-work`)
committed `94c53f3` directly onto local `dev`; it was never pushed, so there
was no actual CI/prod incident, but only by luck (smb-intx3). `workspace-
setup`'s isolation check is no longer "is cwd the live HQ root" (a directory
identity check) -- it is "is the repo currently on a branch
`lib/protected_rigs.sh` lists as protected for it" (main on the HQ root,
`dev` on any rig `bin/pr-autopilot` arms for auto-merge). A dispatch already
on a feature branch is unaffected; only a dispatch that lands directly on
main/dev now gets isolated into a worktree and pushed through `push-and-pr`.

Local fork (2026-09-19, af-6scsz): once `workspace-setup` started isolating
HQ-rig dispatches into a worktree, `do-work` kept closing the work bead
`gc.work_outcome=shipped` right after the local commit -- before
`push-and-pr` (which runs next) had even pushed the branch, let alone
opened a PR. Live incident: af-hyls9 closed shipped while PR #159 was still
open with CI in_progress, caught only afterward by factory-delivery-guard.
`do-work` now defers the shipped close when it detects an HQ worktree
(`metadata.work_dir` still set); `push-and-pr` records the PR and leaves the
work bead `in_progress`. `pr-autopilot` closes it only through `deliver-close`
after both the merge and a successful required CI run on the exact PR head are
proven. Non-HQ dispatches (no worktree, commit == done) and no-op/blocked/
abandoned outcomes are unaffected.

Local fork (2026-09-28, O04): a re-dispatch of the same ticket -- a session
stranded mid-run, or a fresh worker picking the ticket back up -- used to
risk redoing work instead of resuming it: `finish` tried `gh pr create`
again on a branch that already had an open PR and silently dropped the PR
URL when that failed, and an interrupted session that never reached
`push-and-pr` lost every commit made in its worktree along with the
worktree itself. `bin/factory-do-work-workspace enter` now pushes a new
branch immediately and installs a per-worktree post-commit hook that
pushes after every commit, so commits survive a session dying mid-run;
`finish` falls back to `gh pr view` to resume an already-open PR instead of
failing to record one. A worker that genuinely needs to discard existing
work now has exactly one path to do it -- `factory-do-work-workspace
restart <bead-id> <worktree> <branch> <reason>` -- which refuses outright
without a written reason. `bin/ticket-graph-publish patch`'s `supersedes`
handling now copies `gc.work_branch`/`gc.work_base_branch`/`gc.pr_url` from
the superseded ticket onto the ticket that supersedes it, so a re-planned
ticket resumes the prior ticket's branch and PR instead of starting cold.

Local fork (2026-09-29, P06/af-elhn7): the return loop this resume machinery
exists for is now closed on the pr-autopilot side too. A ticket's PR going
DIRTY, or its required check still red after pr-autopilot's one automatic
retry, reopens the ticket bead itself (status open, unassigned, a structured
`gc.pr_rejection_reason` and `gc.pr_rejection_count`) instead of only filing a
side `[ci]`/`[autopilot]` bead nobody was dispatched to act on -- the branch
and PR are left exactly as they are. Whoever claims this reopened ticket next
(this same `workspace-setup` step, keyed on the unchanged bead id) resumes
that same worktree/branch through `bin/factory-do-work-workspace enter`
exactly as the O04 resume path above already does for a stranded session --
there is nothing extra to do here, and `restart` must not be used to discard
a rejected ticket's work just because it came back to the pool. A third
rejection of the same ticket pages the Mayor via `bin/escalation-door mayor`
(promoted to NEEDS BENJAMIN after 2h unresolved by
`orders/escalation-door-sweep.toml`, unchanged by this fork).

Local fork (2026-09-29, P17/af-puf4p): "single-agent work" above describes
one agent per ticket, not one worker session per rig -- that older reading is
retired. `agents/factory-worker/agent.toml` now runs up to two concurrent
sessions on the `agent-factory` rig (product rigs stay at one); nothing in
this formula changes, because `workspace-setup` already gives each dispatch
its own worktree/branch and `ticket-graph-publish`/`dispatch-door` already
serialize declared-scope overlaps and hot-file contention ahead of dispatch
(P08/P16). This formula is unaffected either way, and still uses
`mol-polecat-commit` for the distinct case of several agents on one ticket.

## Variables

| Variable | Source | Description |
|----------|--------|--------------|
| convoy_id | runtime | Input convoy tracking the single work bead |
"""
formula = "mol-do-work"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "workspace-setup"
title = "Read assignment; if on a protected branch, isolate work in a worktree"
description = """
**1. Read your assignment:**

Derive the work bead from the input convoy, then read it:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-do-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
```

**Claim it now (af-pl39t):** dispatching this convoy is the only signal that a
workflow is active against `$WORK_BEAD_ID`. Nothing else flips it off
`open`, so it still reads as ready, unclaimed work and can be dispatched a
second time while this workflow runs:
```bash
gc bd update "$WORK_BEAD_ID" --claim
gc bd update "$WORK_BEAD_ID" --assignee "" \
  --set-metadata "gc.session_name=${GC_SESSION_NAME:-${GC_AGENT:-}}" \
  --set-metadata "gc.session_id=${GC_SESSION_ID:-}"
```

The second update is part of the claim contract, not an unclaim. It leaves the
work bead `in_progress` with its session evidence, but releases its assignee so
the conventional worker's next `gc hook --claim --json` selects the routed
`do-work` formula step. Without that handoff, the default work query sees the
in-progress target before the next graph step and executes it outside the
formula (live canary af-3l8hn, af-kg6j6).

Read the bead's title and description carefully. This is your task.

**Signal liveness:** run `gc bd heartbeat "$WORK_BEAD_ID"` now, and again before any
shell command you expect to run for many minutes (long builds, test sweeps).
It stamps `gc.last_heartbeat_at` so the Factory's guards (e.g. `factory-dispatch-guard`) can tell you are alive and
working rather than wedged.

**2. Never commit directly to a protected branch (af-ogg8z, af-09hxz).**

On 2026-09-17 the Mayor ran `git commit`/`checkout`/`reset --hard` directly
in `/home/benja/agent-factory`, and a worker running this formula committed
af-lb3q the same way. One side effect: `bin/provider-failover` lost its
executable bit for 2 hours with no alert. The same class of mistake also
hit a product rig (smb-u3zzt): a dispatch landed straight on
saymyname-backend's protected `dev`, no branch, no PR.
`bin/factory-do-work-workspace` is a no-op unless the repo you're in is
currently on a branch `lib/protected_rigs.sh` lists as protected for it
(`main` on the HQ root, `dev` on a rig `bin/pr-autopilot` arms), so it is
safe to call unconditionally:

```bash
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"
HERE=$(git rev-parse --show-toplevel 2>/dev/null || echo "$FACTORY_ROOT")
BASE_BRANCH_BEFORE=$(git -C "$HERE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
WORKTREE=$("$FACTORY_ROOT/bin/factory-do-work-workspace" enter "$WORK_BEAD_ID")
if [ "$WORKTREE" != "." ]; then
  cd "$WORKTREE"
  BRANCH="do-work/$WORK_BEAD_ID"
  BASE_BRANCH="$BASE_BRANCH_BEFORE"
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata work_dir="$WORKTREE" \
    --set-metadata gc.work_branch="$BRANCH" \
    --set-metadata gc.work_base_branch="$BASE_BRANCH"
  echo "workspace-setup: isolated in worktree $WORKTREE on branch $BRANCH"
fi
```

If `$WORKTREE` is `.` you were not on a protected branch — proceed exactly
as before, in the current directory.

**Exit criteria:** you know your assignment, and if you started on a
protected branch (the live agent-factory root, or a product rig's `dev`)
you are now working inside an isolated worktree on its own branch instead."""

[[steps]]
id = "do-work"
title = "Implement, verify, commit, and close"
needs = ["workspace-setup"]
description = """
Do the work the bead describes, verify it, commit relevant changes, and
close it. If `workspace-setup` isolated you in a worktree, stay there for
this whole step — do not `cd` back to the live root.

**1. Re-derive your work bead (each step runs fresh):**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"
```

**2. Implement the solution and verify it:**

Do exactly what the bead describes. Follow existing codebase conventions.
Run the verification commands requested by the bead. If the bead does not
name verification commands, run the smallest relevant local test/build check
you can identify. In the Factory's own repository (rig `agent-factory`) that
check depends on where CI runs: when `"$FACTORY_ROOT/bin/ci-runner" mode`
prints `self-hosted`, run `bin/ci-run-tests --rule-checks --changed-since
origin/main` from your work tree (CI runs the whole battery right after, on
the same machine); when it prints anything else, or for no clear answer, run
the whole battery, `bin/ci-run-tests --jobs 4`. A change to docs, CI or
tests alone runs `--rule-checks` either way (`docs/DELIVERY.md`, "What to
run before a pull request"). A test you write or change follows the test
guideline, `"$FACTORY_ROOT/docs/TEST_GUIDELINE.md"` (read it first; no
reviewer of the tests reads a maintenance change, and a test file above 120
seconds turns CI red).

Before closing, inspect the working tree:
```bash
git status --short
```

If you changed product/source files, documentation, tests, configs, or other
repo-owned artifacts for the task, commit those changes before closing the bead:
```bash
git add <files>
git commit -m "<type>: <description>"
```

If the bead asks for sections in the PR description (for example « Non fait »,
« Écarts », « Constats hors ticket »), you do not open the PR yourself —
`push-and-pr` does. Write the sections, as Markdown headings each followed by
its content ("aucun" when empty), in this file; it is never committed and
`push-and-pr` puts it in the PR body:
```bash
PR_BODY="$(git rev-parse --absolute-git-dir)/PR_BODY.md"
```
`push-and-pr` refuses (exit 3) a bead that asks for these sections and has
none.

Do not commit unrelated runtime metadata, local agent directories, caches, or
bead database churn unless the bead explicitly required those files. If the
only remaining dirty files are unrelated runtime/bead metadata, leave them
uncommitted and mention that in your close notes.

**3. Close the target bead when done:**

Record the typed work-record outcome (ADR-0009) on the work bead so eval and
audit can trace work → artifact → outcome, through `bin/deliver-close`'s
`--outcome` door (ADR-0023) — never a raw `gc bd update --set-metadata
gc.work_outcome=...`. Choose the outcome from what actually happened:
- `shipped` — you committed a change that satisfies the bead. Supply
  `--commit <sha>` and `--branch <branch>`.
- `no-op` — the bead needed no change (already satisfied / duplicate); no
  `--commit`/`--branch`.
- `blocked` — you cannot complete it until someone answers or unblocks it.
  `deliver-close` parks the bead (status `blocked`, not closed): its
  dependents stay gated. Also mail the escalation recipient (see step 3b) —
  never leave a blocked bead silent.
- `abandoned` — nobody is expected to unblock it; the bead is closed.
- delivered on another ticket's branch — the fix for this bead is the same
  logical unit as another ticket already in flight, so you committed it there
  instead of opening a branch/PR of your own for this bead (see 3c below).

**Shipped** (you committed a change):
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
WORK_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
[ "$WORK_BRANCH" = "HEAD" ] && WORK_BRANCH=""   # detached HEAD — no stable branch
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // "."')
if [ "$WORKTREE" != "." ]; then
  # af-6scsz: workspace-setup isolated this into an HQ worktree, so the
  # branch is committed but not yet pushed and no PR exists -- push-and-pr
  # opens it next. Closing "shipped" here would claim delivery before there
  # is anything to verify it against (live incident: af-hyls9 closed shipped
  # while PR #159 was still open with CI in_progress). Leave the work bead
  # open; push-and-pr records the PR and pr-autopilot finalizes after merge.
  echo "do-work: HQ worktree — deferring close of $WORK_BEAD_ID to push-and-pr"
else
  "$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
    --outcome shipped --commit "$COMMIT" --branch "$WORK_BRANCH" \
    --verification "<commands you ran>" \
    --reason "Done: <brief summary of what you did>. Verification: <commands run>. Commit: ${COMMIT:-none}."
fi
```

**No-op** (the bead needed no change — already satisfied / duplicate):
```bash
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome no-op --reason "No-op: <why no change was needed>."
```

**3b. Blocked / abandoned** (you could not complete it):

`--classification` is required on every blocked/abandoned close; `deliver-close`
refuses the close outright without it (af-cphvt). First decide (ADR-0028)
whether this is a bounded technical repair still inside your ticket's
approved scope, or a genuine surprise about approved intent, behavior, or
dependency/decomposition topology — `bin/planning-exception classify --kind
repair|semantic|topology` reports which.

If it is `repair`, pass just that:

```bash
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome blocked --classification repair \
  --reason "Blocked: <exactly what is blocking this, and on whom/what>."
gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "BLOCKED: $WORK_BEAD_ID" \
  -m "STATE: <exactly what is blocking this>
NEXT: <what unblocking looks like>"
```

If it is `semantic` or `topology`, run `bin/planning-exception raise` first
(see `docs/PLANNING_EXCEPTION.md` for the register/graph arguments it needs)
and pass the decision id it returns as `--planning-exception-id`:

```bash
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome blocked --classification semantic|topology --planning-exception-id "<decision-id-from-raise>" \
  --reason "Blocked: <exactly what is blocking this, and on whom/what>."
gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "BLOCKED: $WORK_BEAD_ID" \
  -m "STATE: <exactly what is blocking this>
NEXT: <what unblocking looks like>"
```

Use `--outcome abandoned` instead of `blocked` if nobody is expected to
unblock it (out of scope, superseded, etc.) — mail the same way regardless.

**Waiting on the operator's decision** (af-1al0t1: e.g. a prototype ticket
whose operator must pick a variant): post the question with
`"$FACTORY_ROOT/bin/escalation-door" benjamin "$WORK_BEAD_ID" '<json>'` (it
mails the operator itself), then park with `--outcome blocked
--classification repair` as above. Never try to close the bead while its
NEEDS BENJAMIN is active — `deliver-close` refuses every closing form until
the question is answered. `escalation-door repondre` records the answer and
reopens the bead (`clear` reopens it too); the next worker resumes on the same branch and delivers
through the normal PR path.

**3c. Delivered on another ticket's branch** (P07, af-87f9u): the repair this
bead needs is the same logical unit as another ticket's change, so you
committed it on that other ticket's branch instead of a branch of your own.
Do not close this bead and do not call `deliver-close` — it has no PR of its
own to verify yet. Record the hosting PR so pr-autopilot closes this ticket,
with the merge SHA as evidence, once that PR merges:
```bash
gc bd update "$WORK_BEAD_ID" \
  --set-metadata "gc.delivered_via_pr=<hosting PR number>" \
  --append-notes "Delivered via PR #<hosting PR number> (<hosting ticket/branch>); pr-autopilot closes this ticket once that PR merges."
```
A PR named here that never merges, or merges closed-without-merging, leaves
this ticket open — nothing else should touch it.

**4. Close this formula step:**

If `GC_BEAD_ID` is set and is different from `$WORK_BEAD_ID`, close it too. This
prevents `mol-do-work` wrapper beads from remaining ready after the real work
is complete.
```bash
if [ -n "${GC_BEAD_ID:-}" ] && [ "$GC_BEAD_ID" != "$WORK_BEAD_ID" ]; then
  gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Target $WORK_BEAD_ID completed. Commit: ${COMMIT:-none}."
fi
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** The work described in the bead is complete and committed;
non-PR terminal outcomes are closed, while HQ PR-backed work remains
`in_progress` for the merge+CI finalizer. The claimed formula step is closed
when `GC_BEAD_ID` is available."""

[[steps]]
id = "push-and-pr"
title = "If isolated on a protected branch: push the branch, open a PR, and remove the worktree"
needs = ["do-work"]
description = """
Only applies if `workspace-setup` isolated you in a worktree (the work bead
has `metadata.work_dir` set) — otherwise this step does nothing.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
WORKTREE=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.work_dir // "."')
BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.work_branch"] // empty')
BASE_BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.work_base_branch"] // empty')
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"

if [ "$WORKTREE" = "." ]; then
  echo "push-and-pr: no isolated worktree for this dispatch — nothing to do"
else
  PR_URL=$("$FACTORY_ROOT/bin/factory-do-work-workspace" finish \
    "$WORK_BEAD_ID" "$WORKTREE" "$BRANCH" "$BASE_BRANCH")
  FINISH_RC=$?
  if [ "$FINISH_RC" = "4" ]; then
    # af-cjaj8o: already merged (or no difference with the base) -- no PR was
    # opened and the worktree is gone. Do not touch gc.pr_url,
    # gc.delivery_status or the notes: they are the ticket's merge record.
    gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
    echo "push-and-pr: nothing to deliver for $WORK_BEAD_ID — delivery record left as it is"
  elif [ "$FINISH_RC" != "0" ]; then
    # af-hmqlf5: finish refused (3) or could not push (1) -- nothing was
    # delivered and the worktree is still there. Write nothing on the bead:
    # dropping work_dir here made the re-run read "." and do nothing.
    echo "push-and-pr: finish exited $FINISH_RC for $WORK_BEAD_ID — work_dir kept, run this block again once resolved" >&2
  elif [ -n "$PR_URL" ]; then
    gc bd update "$WORK_BEAD_ID" \
      --set-metadata "gc.pr_url=$PR_URL" \
      --set-metadata "gc.delivery_contract=pr-ci-merged-v1" \
      --set-metadata "gc.delivery_status=waiting" \
      --unset-metadata work_dir \
      --notes "PR opened: $PR_URL. Work remains in_progress until merge and exact-head required CI are proven."
  else
    gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
    echo "push-and-pr: branch pushed but no PR was opened (gh unavailable or failed) — open one by hand: $BRANCH -> $BASE_BRANCH" >&2
  fi
fi
```

If `finish` exits 3, nothing failed: the bead asks for PR sections that are
not written yet. Its message names the file to write; write it, then run the
block above again. Do not mail anyone for that.

On any non-zero exit other than 4 the block writes nothing on the work bead
and keeps `work_dir`, so running it again resumes the same worktree
(af-hmqlf5, 2026-10-08: it used to drop `work_dir`, and the re-run printed
"nothing to do" with the work still unpublished).

If `finish` exits 4, nothing failed either: the ticket's PR already merged
with this exact head while the dispatch was running, or the branch has no
difference with the base. No PR is opened and none must be opened by hand;
the block above only drops `work_dir` and leaves `gc.pr_url`,
`gc.delivery_status` and the notes as they are (af-cjaj8o, 2026-10-08: on
af-cbp84n a second, empty PR #445 was opened after #444 had merged and the
closed ticket was rewritten to `waiting` on it, which failed pr-autopilot five
times).

If the push itself fails (`factory-do-work-workspace finish` exits with any
other non-zero status),
the worktree is deliberately left in place for a human/next session to
resolve — mail the escalation recipient rather than deleting work:
```bash
gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "HELP: could not push $BRANCH" \
  -m "Issue: $WORK_BEAD_ID. Worktree left at $WORKTREE for manual recovery."
```

**Exit criteria:** if this dispatch was isolated in a worktree, the worktree
no longer exists on disk and the branch is pushed with (when `gh` succeeded)
an open PR against the base branch (no PR and an untouched delivery record
when `finish` exited 4); a work bead that `do-work` deferred remains
`in_progress` with `gc.delivery_status=waiting` until `deliver-close` records
merge+exact-head-CI proof; otherwise this step is a documented no-op."""

[[steps]]
id = "drain"
title = "Close drain step and signal completion"
needs = ["push-and-pr"]
description = """
Work is done. Close this drain step, then signal the controller to reclaim this
session:

```bash
if [ -n "${GC_BEAD_ID:-}" ]; then
  gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Drain acknowledged."
fi
gc runtime drain-ack
```

Run exactly these commands and nothing else."""
