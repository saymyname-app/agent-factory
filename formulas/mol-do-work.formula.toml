description = """
Simple work formula — read the bead, do what it says, close it.

This is the minimal work lifecycle for coding agents. No refinery handoff.
The agent reads the bead's description and implements the solution. On
every rig except the HQ agent-factory root itself, that means the current
working directory, same as before — no git branching, no worktree
isolation.

Use this for demos and simple single-agent workflows. For production
multi-agent setups with worktree isolation, use mol-polecat-commit
instead (or mol-polecat-work from the gastown pack for full refinery
review).

Local fork (2026-09-17, Factory audit F4): "also mail Witness" was prose
with no concrete command, in the Factory's most-used formula (42 runs).
"Witness" is not a real recipient here (a single-operator Factory, not a
multi-agent Gastown pool) — an agent following it literally would mail a
nonexistent role. Made concrete: mail `${GC_ESCALATION_RECIPIENT:-human}`.

Local fork (2026-09-18, af-ogg8z): this formula used to hand a worker the
live agent-factory root as its cwd with no isolation at all -- the same
class of mistake the Mayor made minutes earlier the same night (committing
directly in the live root). A worker literally did it: af-lb3q was
committed straight into the live root, no branch, no PR. `workspace-setup`
and `push-and-pr` now isolate work on the HQ rig in a worktree via
`bin/factory-do-work-workspace`, which is a documented no-op everywhere
else -- other rigs keep the exact behavior this formula always had.

## Variables

| Variable | Source | Description |
|----------|--------|--------------|
| convoy_id | runtime | Input convoy tracking the single work bead |
"""
formula = "mol-do-work"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "workspace-setup"
title = "Read assignment; on the HQ rig, isolate work in a worktree"
description = """
**1. Read your assignment:**

Derive the work bead from the input convoy, then read it:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-do-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
```

Read the bead's title and description carefully. This is your task.

**Signal liveness:** run `gc bd heartbeat "$WORK_BEAD_ID"` now, and again before any
shell command you expect to run for many minutes (long builds, test sweeps).
It stamps `gc.last_heartbeat_at` so the dashboard can tell you are alive and
working rather than wedged.

**2. Never edit the live agent-factory root directly (af-ogg8z).**

On 2026-09-17 the Mayor ran `git commit`/`checkout`/`reset --hard` directly
in `/home/benja/agent-factory`, and a worker running this formula committed
af-lb3q the same way. One side effect: `bin/provider-failover` lost its
executable bit for 2 hours with no alert. `bin/factory-do-work-workspace`
is a no-op everywhere except that exact directory, so it is safe to call
unconditionally:

```bash
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"
WORKTREE=$("$FACTORY_ROOT/bin/factory-do-work-workspace" enter "$WORK_BEAD_ID")
if [ "$WORKTREE" != "." ]; then
  cd "$WORKTREE"
  BRANCH="do-work/$WORK_BEAD_ID"
  BASE_BRANCH=$(git -C "$FACTORY_ROOT" rev-parse --abbrev-ref HEAD)
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata work_dir="$WORKTREE" \
    --set-metadata gc.work_branch="$BRANCH" \
    --set-metadata gc.work_base_branch="$BASE_BRANCH"
  echo "workspace-setup: isolated in worktree $WORKTREE on branch $BRANCH"
fi
```

If `$WORKTREE` is `.` you were not in the live root — proceed exactly as
before, in the current directory.

**Exit criteria:** you know your assignment, and if you started in the live
agent-factory root you are now working inside an isolated worktree on its
own branch instead."""

[[steps]]
id = "do-work"
title = "Implement, verify, commit, and close"
needs = ["workspace-setup"]
description = """
Do the work the bead describes, verify it, commit relevant changes, and
close it. If `workspace-setup` isolated you in a worktree, stay there for
this whole step — do not `cd` back to the live root.

**1. Re-derive your work bead (each step runs fresh):**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"
```

**2. Implement the solution and verify it:**

Do exactly what the bead describes. Follow existing codebase conventions.
Run the verification commands requested by the bead. If the bead does not
name verification commands, run the smallest relevant local test/build check
you can identify.

Before closing, inspect the working tree:
```bash
git status --short
```

If you changed product/source files, documentation, tests, configs, or other
repo-owned artifacts for the task, commit those changes before closing the bead:
```bash
git add <files>
git commit -m "<type>: <description>"
```

Do not commit unrelated runtime metadata, local agent directories, caches, or
bead database churn unless the bead explicitly required those files. If the
only remaining dirty files are unrelated runtime/bead metadata, leave them
uncommitted and mention that in your close notes.

**3. Close the target bead when done:**

Record the typed work-record outcome (ADR-0009) on the work bead so eval and
audit can trace work → artifact → outcome, through `bin/deliver-close`'s
`--outcome` door (ADR-0023) — never a raw `gc bd update --set-metadata
gc.work_outcome=...`. Choose the outcome from what actually happened:
- `shipped` — you committed a change that satisfies the bead. Supply
  `--commit <sha>` and `--branch <branch>`.
- `no-op` — the bead needed no change (already satisfied / duplicate); no
  `--commit`/`--branch`.
- `blocked` / `abandoned` — you could not complete it. Also mail the escalation
  recipient (see step 3b) — never leave a blocked bead silent.

**Shipped** (you committed a change):
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
WORK_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
[ "$WORK_BRANCH" = "HEAD" ] && WORK_BRANCH=""   # detached HEAD — no stable branch
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome shipped --commit "$COMMIT" --branch "$WORK_BRANCH" \
  --verification "<commands you ran>" \
  --reason "Done: <brief summary of what you did>. Verification: <commands run>. Commit: ${COMMIT:-none}."
```

**No-op** (the bead needed no change — already satisfied / duplicate):
```bash
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome no-op --reason "No-op: <why no change was needed>."
```

**3b. Blocked / abandoned** (you could not complete it):
```bash
"$FACTORY_ROOT/bin/deliver-close" "$WORK_BEAD_ID" \
  --outcome blocked --reason "Blocked: <exactly what is blocking this, and on whom/what>."
gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "BLOCKED: $WORK_BEAD_ID" \
  -m "STATE: <exactly what is blocking this>
NEXT: <what unblocking looks like>"
```
Use `--outcome abandoned` instead of `blocked` if nobody is expected to
unblock it (out of scope, superseded, etc.) — mail the same way regardless.

**4. Close this formula step:**

If `GC_BEAD_ID` is set and is different from `$WORK_BEAD_ID`, close it too. This
prevents `mol-do-work` wrapper beads from remaining ready after the real work
is complete.
```bash
if [ -n "${GC_BEAD_ID:-}" ] && [ "$GC_BEAD_ID" != "$WORK_BEAD_ID" ]; then
  gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Target $WORK_BEAD_ID completed. Commit: ${COMMIT:-none}."
fi
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** The work described in the bead is complete, relevant changes
are committed, the target bead is closed, and the claimed formula step is
closed when `GC_BEAD_ID` is available."""

[[steps]]
id = "push-and-pr"
title = "On the HQ rig: push the branch, open a PR, and remove the worktree"
needs = ["do-work"]
description = """
Only applies if `workspace-setup` isolated you in a worktree (the work bead
has `metadata.work_dir` set) — otherwise this step does nothing.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
WORKTREE=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.work_dir // "."')
BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.work_branch"] // empty')
BASE_BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata["gc.work_base_branch"] // empty')
FACTORY_ROOT="${FACTORY_ROOT:-/home/benja/agent-factory}"

if [ "$WORKTREE" = "." ]; then
  echo "push-and-pr: no HQ worktree for this dispatch — nothing to do"
else
  PR_URL=$("$FACTORY_ROOT/bin/factory-do-work-workspace" finish \
    "$WORK_BEAD_ID" "$WORKTREE" "$BRANCH" "$BASE_BRANCH")
  if [ -n "$PR_URL" ]; then
    gc bd update "$WORK_BEAD_ID" \
      --set-metadata "gc.pr_url=$PR_URL" \
      --unset-metadata work_dir \
      --notes "PR opened: $PR_URL"
  else
    gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
    echo "push-and-pr: branch pushed but no PR was opened (gh unavailable or failed) — open one by hand: $BRANCH -> $BASE_BRANCH" >&2
  fi
fi
```

If the push itself fails (`factory-do-work-workspace finish` exits non-zero),
the worktree is deliberately left in place for a human/next session to
resolve — mail the escalation recipient rather than deleting work:
```bash
gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "HELP: could not push $BRANCH" \
  -m "Issue: $WORK_BEAD_ID. Worktree left at $WORKTREE for manual recovery."
```

**Exit criteria:** if this was an HQ dispatch, the worktree no longer exists
on disk and the branch is pushed with (when `gh` succeeded) an open PR
against the base branch; otherwise this step is a documented no-op."""

[[steps]]
id = "drain"
title = "Close drain step and signal completion"
needs = ["push-and-pr"]
description = """
Work is done. Close this drain step, then signal the controller to reclaim this
session:

```bash
if [ -n "${GC_BEAD_ID:-}" ]; then
  gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Drain acknowledged."
fi
gc runtime drain-ack
```

Run exactly these commands and nothing else."""
