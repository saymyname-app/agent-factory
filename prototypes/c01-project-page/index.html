<meta charset="utf-8">
<title>Cockpit V2 — page projet (prototype)</title>
<!--
  PROTOTYPE JETABLE — T21 « Prototype de la page projet » (Cockpit V2, C01).
  Question : à quoi ressemble la page d'un projet, avec ses chantiers par étape,
  sur PC et sur iPhone ? Principe déjà acquis (af-arlph5.11) : chantiers par
  étape (variante C), lien depuis chaque projet — ce prototype explore trois
  façons de présenter ce principe. Commutables par la barre flottante (← →,
  ou #1 #2 #3 dans l'URL). Base visuelle : tokens validés du prototype
  prototype/c01-home-screen (variante D).
  Données 100 % synthétiques : aucun nom de personne réelle, aucun identifiant réel.
  Aucune action n'est envoyée nulle part : tout vit en mémoire.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --ink:#151B26; --ink-2:#465063; --muted:#687286;
  --line:#D8DDE6; --accent:#2B4CC0; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA;
  --urgent:#C22D25; --urgent-soft:#FBE6E4; --normal:#AD6208; --normal-soft:#FAEDD6;
  --info:#5A6679; --info-soft:#E8ECF2; --ok:#1F7B4B; --ok-soft:#DFF1E6;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --font:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:10px; --fs-xs:12.5px; --fs-s:14px; --fs-m:16px; --fs-l:19px; --fs-xl:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E6E9EF; --ink-2:#B6BDCA; --muted:#8A93A4;
    --line:#2A313D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1E2644;
    --urgent:#FF6F63; --urgent-soft:#3A1B19; --normal:#F0A33A; --normal-soft:#35270F;
    --info:#9BA5B7; --info-soft:#222833; --ok:#4DC48B; --ok-soft:#15301F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E6E9EF; --ink-2:#B6BDCA; --muted:#8A93A4;
  --line:#2A313D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1E2644;
  --urgent:#FF6F63; --urgent-soft:#3A1B19; --normal:#F0A33A; --normal-soft:#35270F;
  --info:#9BA5B7; --info-soft:#222833; --ok:#4DC48B; --ok-soft:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-m);line-height:1.45;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
button,a{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stage{max-width:1280px;margin-inline:auto}
.app{container-type:inline-size;container-name:app}
body.framed .stage{max-width:390px;height:780px;overflow:auto;border:1px solid var(--line);border-radius:34px;margin-block:18px;padding-inline:14px;background:var(--bg);box-shadow:var(--shadow)}
.frame-note{display:none;text-align:center;font-size:var(--fs-xs);color:var(--muted);margin-top:14px}
body.framed .frame-note{display:block}

/* ---------- éléments partagés ---------- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand a.back{font-size:var(--fs-s);color:var(--accent);text-decoration:none;white-space:nowrap}
.brand h1{font-size:var(--fs-l);letter-spacing:-.01em;overflow-wrap:anywhere}
.brand .who{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fresh{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--ink-2);flex-wrap:wrap}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.fresh .recheck{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:var(--fs-xs)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.lvl i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip.atoi{background:var(--accent-soft);color:var(--accent)}
.chip.probleme{background:var(--normal-soft);color:var(--normal)}
.chip.bloque{background:var(--urgent-soft);color:var(--urgent)}
.chip.go{border:0;cursor:pointer;font:inherit}
.chip.go::after{content:" →"}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:var(--fs-s);font-weight:600;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
details.more{font-size:var(--fs-s)}
details.more summary{color:var(--muted);cursor:pointer;font-size:var(--fs-xs);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";font-size:10px}
details.more[open] summary::before{content:"▾"}
.det{display:grid;gap:6px;margin-top:8px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:var(--fs-xs);color:var(--ink-2)}
.det .row{display:grid;grid-template-columns:92px 1fr;gap:10px}
.det .row span:first-child{color:var(--muted)}
.stepper{display:flex;gap:3px;align-items:center}
.stepper span{height:6px;flex:1;border-radius:3px;background:var(--line);min-width:10px}
.stepper span.done{background:var(--ink-2)}
.stepper span.cur{background:var(--accent)}
.zone{margin-top:22px}
.zone-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.zone-h h2{font-size:var(--fs-l)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.summary-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:var(--fs-s)}
.summary-row .sep{width:1px;height:16px;background:var(--line)}
.history-link{font-size:var(--fs-s);color:var(--accent);text-decoration:none}

/* ---------- barre du prototype (ne fait pas partie du design) ---------- */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  background:#FFE14D;color:#1a1a1a;border:2px solid #1a1a1a;border-radius:16px;padding:6px 8px;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.35);max-width:calc(100vw - 16px)}
.proto button,.proto select{background:#fff;border:1.5px solid #1a1a1a;border-radius:9px;padding:5px 9px;font:600 13px system-ui,sans-serif;color:#1a1a1a}
.proto .vl{min-width:190px;text-align:center}
.proto .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}

/* ================= VARIANTE 1 — Tableau (colonnes par étape) ================= */
.v1 .pipe-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.v1 .board{display:grid;grid-template-columns:repeat(7,minmax(168px,1fr));min-width:1180px}
.v1 .board > div{padding:10px 12px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:var(--fs-s)}
.v1 .board > div:nth-child(-n+7){border-top:0}
.v1 .board > div:nth-child(7n+1){border-left:0}
.v1 .bh{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center}
.v1 .bh .n{font-family:var(--mono);color:var(--ink-2)}
.v1 .na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px)}
.v1 .card{display:grid;gap:6px;background:var(--surface-2);border-radius:8px;padding:9px 10px;margin-bottom:8px;border:1px solid transparent}
.v1 .card.urgent-b{border-color:var(--urgent)}
.v1 .card .n{font-weight:700;font-size:var(--fs-s)}
.v1 .card .s{font-size:var(--fs-xs);color:var(--ink-2)}
.v1 .card .age{font-size:11px;color:var(--muted)}

/* ================= VARIANTE 2 — Groupes verticaux (une étape à la fois) ================= */
.v2 .groups{display:grid;gap:14px;margin-top:14px}
.v2 .group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.v2 .group.empty-stage{opacity:.6}
.v2 .group-h{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.v2 .group-h h3{font-size:var(--fs-m);display:flex;align-items:center;gap:8px}
.v2 .group-h .num{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.v2 .group-h .cnt{font-family:var(--mono);color:var(--muted);font-size:var(--fs-s)}
.v2 .g-item{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.v2 .g-item:first-of-type{border-top:0}
.v2 .g-item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.v2 .g-item .n{font-weight:700}
.v2 .g-item .s{font-size:var(--fs-s);color:var(--ink-2)}
.v2 .g-item .age{font-size:var(--fs-xs);color:var(--muted)}
.v2 .g-empty{padding:14px;font-size:var(--fs-s);color:var(--muted)}

/* ================= VARIANTE 3 — Bande (liste continue, repère d'étape inline) ================= */
.v3 .strip{display:grid;gap:10px;margin-top:14px}
.v3 .s-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.v3 .s-item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.v3 .s-item .n{font-weight:700;font-size:var(--fs-m)}
.v3 .s-item .s{font-size:var(--fs-s);color:var(--ink-2)}
.v3 .s-item .stepline{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.v3 .stepnames{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.v3 .stepnames span.on{color:var(--accent);font-weight:600}
@container app (min-width: 900px){
  .v3 .strip{grid-template-columns:1fr 1fr}
}
</style>

<div class="stage"><div class="app" id="app"></div></div>
<p class="frame-note">Cadre iPhone (390 px) : même rendu que sur le téléphone.</p>

<div class="proto" id="proto" aria-label="Commandes du prototype">
  <span class="tag">Prototype</span>
  <button id="prev" aria-label="Variante précédente">←</button>
  <span class="vl" id="vlabel"></span>
  <button id="next" aria-label="Variante suivante">→</button>
  <select id="proj" aria-label="Projet"></select>
  <button id="theme" aria-label="Thème"></button>
  <button id="frame" aria-label="Cadre iPhone">iPhone</button>
</div>

<script>
/* ---------- données synthétiques ---------- */
const NOW = "14:32";
const STAGES = ["Cadrage","Spec","Graphe","Livraison","Livré","Accepté","Promu"];
const STATE_LBL = {atoi:"À toi de jouer", probleme:"Problème remonté", bloque:"Bloqué"};

const DATA = {
  saymyname: {
    name:"SayMyName", step:"Roadmap : Bêta privée",
    promo:"dev a 14 commits d'avance sur main : promotion à ta main.",
    protectedMain:false,
    chantiers:[
      {name:"Export des listes", st:3, s:"5/9 tickets mergés · 2 en cours · 1 en PR", since:"depuis 3 j", state:"probleme"},
      {name:"Page d'accueil publique", st:4, s:"Livré le 29/09 : à accepter", since:"depuis 1 j", state:"atoi"},
      {name:"Invitations par lien", st:1, s:"Spec en rédaction", since:"depuis 2 j", state:null},
      {name:"Recherche par pseudonyme", st:2, s:"Graphe brouillon : à approuver", since:"depuis 5 h", state:"atoi"},
      {name:"Nettoyage des branches anciennes", st:0, s:"Carte de planification : 3/6 décisions", since:"depuis 9 j", state:null},
      {name:"Export CSV (v1)", st:6, s:"Tous les commits sur main", since:"promu le 22/09", state:null},
      {name:"Filtre par tag", st:5, s:"Accepté le 20/09 : en attente de promotion", since:"depuis 6 j", state:null},
    ]},
  usine: {
    name:"Usine", step:"Roadmap : A7 · Cockpit V2",
    promo:null, protectedMain:true,
    chantiers:[
      {name:"Cockpit V2", st:3, s:"6/25 tickets mergés · 2 en cours · 1 en PR", since:"depuis 2 h", state:"atoi"},
      {name:"Fiabilité des tâches planifiées", st:3, s:"11/13 tickets mergés · aucun ticket prêt, en cours ni en PR", since:"depuis 40 min", state:"bloque"},
      {name:"Registre des projets", st:1, s:"Spec en DRAFT_SPEC : à approuver", since:"depuis 3 h", state:"atoi"},
    ]}
};
const PROJECTS = [{k:"saymyname", label:"SayMyName"}, {k:"usine", label:"Usine"}];

/* ---------- état du prototype ---------- */
const VARIANTS = [
  {k:"1", name:"Tableau"},
  {k:"2", name:"Groupes verticaux"},
  {k:"3", name:"Bande"}
];
const st = {v:0, proj:"saymyname", theme:"system", framed:false};
try{ const h=(location.hash||"").replace("#",""); const i=VARIANTS.findIndex(x=>x.k===h); if(i>=0) st.v=i; }catch(e){}
try{ const s=JSON.parse(localStorage.getItem("c01projpage")||"{}"); if(s.proj) st.proj=s.proj; if(s.theme) st.theme=s.theme; }catch(e){}
const save=()=>{ try{ localStorage.setItem("c01projpage", JSON.stringify({proj:st.proj, theme:st.theme})); }catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function project(){ return DATA[st.proj]; }
function stageCount(p){ return p.protectedMain ? 6 : 7; }
function stepper(p, c){
  const n = stageCount(p);
  let s=""; for(let i=0;i<n;i++) s+=`<span class="${i<c.st?"done":i===c.st?"cur":""}" title="${STAGES[i]}"></span>`;
  return `<div class="stepper" aria-label="Étape ${c.st+1} sur ${n} : ${STAGES[c.st]}">${s}</div>`;
}
const stateChip = c => c.state ? `<span class="chip go ${c.state}" title="Aller là où tu dois agir">${STATE_LBL[c.state]}</span>` : "";
function fresh(){ return `<span class="fresh"><span class="dot"></span>Tout est à jour à <time>${NOW}</time> (Paris) <button class="recheck" data-a="recheck">Revérifier</button></span>`; }
function topbar(p){
  return `<header class="topbar"><div class="brand"><a class="back" href="#" data-a="home">← Accueil</a><h1>${esc(p.name)}</h1><span class="who">${esc(p.step)}</span></div>${fresh()}</header>`;
}
function summary(p){
  const atoi = p.chantiers.filter(c=>c.state==="atoi").length;
  const probleme = p.chantiers.filter(c=>c.state==="probleme").length;
  const bloque = p.chantiers.filter(c=>c.state==="bloque").length;
  return `<div class="summary-row">
    <span><b>${p.chantiers.length}</b> chantiers actifs</span>
    ${atoi?`<span class="sep"></span><span class="chip atoi">${atoi} à toi de jouer</span>`:""}
    ${probleme?`<span class="sep"></span><span class="chip probleme">${probleme} problème remonté</span>`:""}
    ${bloque?`<span class="sep"></span><span class="chip bloque">${bloque} bloqué</span>`:""}
    <span class="sep"></span><a class="history-link" href="#" data-a="history">Historique du projet →</a>
  </div>`;
}
function promo(p){ return p.promo ? `<p class="muted" style="font-size:var(--fs-s);margin:10px 2px 0">${esc(p.promo)}</p>` : ""; }

/* ================= VARIANTE 1 — Tableau ================= */
function renderV1(){
  const p = project();
  const n = stageCount(p);
  const cols = STAGES.slice(0,n).map((s,i)=>`<div class="bh">${s}<span class="n">${p.chantiers.filter(c=>c.st===i).length||""}</span></div>`).join("");
  const cells = STAGES.slice(0,n).map((s,i)=>{
    const cs = p.chantiers.filter(c=>c.st===i);
    return `<div>${cs.map(c=>`<div class="card ${c.state==='bloque'?'urgent-b':''}"><span class="n">${esc(c.name)}</span><span class="s">${esc(c.s)}</span>${stateChip(c)}<span class="age">${esc(c.since)}</span></div>`).join("")}</div>`;
  }).join("");
  const naCol = !p.protectedMain ? "" : `<div class="na" title="Sans objet : la branche protégée est main"></div>`;
  return `<div class="v1">
    ${topbar(p)}
    ${summary(p)}
    <section class="zone"><div class="zone-h"><h2>Chantiers par étape</h2></div>
      <div class="pipe-scroll"><div class="board">${cols}${cells}${naCol}</div></div>
      ${promo(p)}
    </section>
  </div>`;
}

/* ================= VARIANTE 2 — Groupes verticaux ================= */
function renderV2(){
  const p = project();
  const n = stageCount(p);
  const groups = STAGES.slice(0,n).map((s,i)=>{
    const cs = p.chantiers.filter(c=>c.st===i);
    return `<div class="group ${cs.length?"":"empty-stage"}">
      <div class="group-h"><h3><span class="num">${i+1}</span>${s}</h3><span class="cnt">${cs.length}</span></div>
      ${cs.length ? cs.map(c=>`<div class="g-item"><div class="top"><span class="n">${esc(c.name)}</span>${stateChip(c)}</div><div class="s">${esc(c.s)}</div><div class="age">${esc(c.since)}</div></div>`).join("")
                  : `<div class="g-empty">Aucun chantier à cette étape.</div>`}
    </div>`;
  }).join("");
  return `<div class="v2">
    ${topbar(p)}
    ${summary(p)}
    <section class="zone"><div class="zone-h"><h2>Chantiers par étape</h2></div>
      <div class="groups">${groups}</div>
      ${promo(p)}
    </section>
  </div>`;
}

/* ================= VARIANTE 3 — Bande ================= */
function renderV3(){
  const p = project();
  const n = stageCount(p);
  const items = p.chantiers.slice().sort((a,b)=>b.st-a.st).map(c=>`
    <div class="s-item">
      <div class="top"><span class="n">${esc(c.name)}</span>${stateChip(c)}</div>
      <div class="s">${esc(c.s)} · ${esc(c.since)}</div>
      <div class="stepline">${stepper(p,c)}</div>
      <div class="stepnames">${STAGES.slice(0,n).map((s,i)=>`<span class="${i===c.st?"on":""}">${s}</span>`).join("")}</div>
    </div>`).join("");
  return `<div class="v3">
    ${topbar(p)}
    ${summary(p)}
    <section class="zone"><div class="zone-h"><h2>Chantiers par étape</h2></div>
      <div class="strip">${items}</div>
      ${promo(p)}
    </section>
  </div>`;
}

/* ---------- rendu + barre ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(st.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", st.theme);
  document.getElementById("theme").textContent = {system:"Thème : système", light:"Thème : clair", dark:"Thème : sombre"}[st.theme];
}
function render(){
  const v = VARIANTS[st.v];
  document.getElementById("app").innerHTML = [renderV1,renderV2,renderV3][st.v]();
  document.getElementById("vlabel").textContent = `${v.k} · ${v.name}`;
  document.getElementById("proj").value = st.proj;
  document.body.classList.toggle("framed", st.framed);
  document.getElementById("frame").textContent = st.framed ? "Pleine largeur" : "Cadre iPhone";
  try{ history.replaceState(null,"","#"+v.k); }catch(e){}
}
document.getElementById("proj").innerHTML = PROJECTS.map(p=>`<option value="${p.k}">${esc(p.label)}</option>`).join("");
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="recheck"){ e.preventDefault(); }
  if(a==="home"){ e.preventDefault(); }
  if(a==="history"){ e.preventDefault(); }
});
function go(d){ st.v=(st.v+d+VARIANTS.length)%VARIANTS.length; render(); }
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("proj").onchange=e=>{ st.proj=e.target.value; save(); render(); };
document.getElementById("theme").onclick=()=>{ st.theme={system:"light",light:"dark",dark:"system"}[st.theme]; save(); applyTheme(); };
document.getElementById("frame").onclick=()=>{ st.framed=!st.framed; render(); };
document.addEventListener("keydown", e=>{
  const tg=e.target; if(tg.closest && tg.closest("input,textarea,select,[contenteditable]")) return;
  if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1);
});
window.addEventListener("hashchange", ()=>{ const i=VARIANTS.findIndex(x=>"#"+x.k===location.hash); if(i>=0&&i!==st.v){ st.v=i; render(); }});
applyTheme(); render();
</script>
