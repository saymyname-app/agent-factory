name: Factory CI

# The gate that lets agent-factory PRs merge themselves. Without a required
# check there is nothing to gate on, so branches pile up unmerged — which is
# exactly what happened up to 2026-09-15 (28 branches, 21 commits of drift).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Factory Python runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Syntax check every Python and shell entry point
        run: |
          set -euo pipefail
          python -m compileall -q lib tests
          for f in bin/*; do
            head -1 "$f" | grep -q 'bash\|sh$' && bash -n "$f" && echo "ok $f" || true
          done

      - name: Product release tests
        run: python tests/product-release-test.py

      - name: Approved Ticket Graph atomic publication
        run: python tests/ticket-graph-publish-test.py

      - name: Register a project through one Project Planning Profile (af-i3k3f)
        run: python tests/project-planning-profile-test.py

      - name: Promote and resume a durable Wayfinding Run (af-q7r0d)
        run: python tests/wayfinding-run-test.py

      - name: Approve, freeze and revise Planning Artifacts by exact digest (af-4x34b)
        run: python tests/spec-approve-test.py

      - name: Route a semantic surprise through one Planning Exception (af-oun2u)
        run: python tests/planning-exception-test.py

      - name: Planning Run router wiring to-spec, approve, publish, wayfinding (af-pxq7e)
        run: python tests/planning-run-router-test.py

      - name: Observe planning and delivery changes without idle model calls (af-ueuq6)
        run: python tests/factory-observe-test.py

      - name: Ensure fixture sandbox runtime
        run: |
          packages=()
          command -v bwrap >/dev/null || packages+=(bubblewrap)
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            command -v apparmor_parser >/dev/null || packages+=(apparmor)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo apparmor_parser --replace --skip-read-cache --skip-cache \
              config/fixture-city-bwrap.apparmor
          fi

      - name: Fixture City public-behavior oracle
        run: python tests/fixture-city-oracle-test.py

      - name: Planning allocation comparison and bounded reversal
        run: python tests/planning-allocation-prototype-test.py

      - name: Planning Run resume across provider and surface
        run: python tests/planning-run-resume-oracle-test.py

      - name: Planning Run reaching a canonical Spec
        run: python tests/planning-run-to-spec-oracle-test.py

      - name: Role, concurrency and retention qualification
        run: python tests/role-qualification-oracle-test.py

      - name: Planning Map and decision concurrency
        run: python tests/planning-map-concurrency-prototype-test.py

      - name: Project isolation and multi-project grant
        run: python tests/project-isolation-oracle-test.py

      - name: Factory guard worktree hygiene
        run: bash tests/factory-guard-worktree-test.sh

      - name: Deliver-close proof-field guard tests
        run: bash tests/deliver-close-test.sh

      - name: Structural delivery formula and finalizer wiring
        run: bash tests/delivery-formula-contract-test.sh

      - name: build-basic publish files a follow-up bead on overlapping-worktree no-op
        run: bash tests/build-basic-publish-overlap-followup-test.sh

      - name: ADR-0023 campaign-pointer write door
        run: bash tests/campaign-pointer-test.sh

      - name: ADR-0023 coordination pointers are written only through a door
        run: bash tests/coordination-pointer-doors-test.sh

      # --- registered 2026-09-16 -------------------------------------------
      # CI enumerated its tests by hand and the list had drifted to 7 of 14.
      # These five pass on a bare runner and had simply been forgotten; a test
      # that is never invoked cannot fail, so nothing reported the gap. The
      # registration check below is what stops it happening again.
      - name: Factory guard sees the working tree
        run: bash tests/factory-guard-dirty-tree-test.sh

      - name: Factory guard fast-forwards a clean live root
        run: bash tests/factory-guard-live-root-sync-test.sh

      - name: Operator context contract
        run: bash tests/operator-context-test.sh

      - name: Doctor triage classification
        run: python tests/factory-doctor-test.py

      - name: Session-boot rules (identity assessment, streak tracking) (af-jj9u7)
        run: python tests/factory-session-boot-test.py

      - name: Factory guard detects a stuck-at-creation named session (af-jj9u7)
        run: bash tests/factory-guard-session-boot-test.sh

      - name: Watchdog assessment rules (aged gates, stuck PRs, false-success closes)
        run: python tests/factory-watchdog-test.py

      - name: Factory watchdog pages and throttles
        run: bash tests/factory-watchdog-test.sh

      - name: Provider failover
        run: python tests/provider-failover-test.py

      - name: Factory guard regenerates the provider overlay
        run: bash tests/factory-guard-provider-overlay-test.sh

      - name: Formula build gates are wired into every rig (af-uxz57)
        run: python tests/factory-build-gates-test.py

      - name: Build-basic hard gates fail fast (af-jz8kc)
        run: python tests/build-basic-fail-fast-test.py

      - name: Build-basic same-session shared worktree lifecycle (af-5z6p7)
        run: bash tests/factory-shared-drain-workspace-test.sh

      - name: Reversibility classification
        run: python tests/reversibility-test.py

      - name: Merge actor holds irreversible changes
        run: bash tests/pr-autopilot-reversibility-test.sh

      - name: Merge actor flags PRs stuck across passes
        run: bash tests/pr-autopilot-stuck-test.sh

      - name: Merge actor closes CI-failure beads once checks recover or merge
        run: bash tests/pr-autopilot-ci-failure-test.sh

      - name: Merge actor retries a transient required-check failure once before flagging
        run: bash tests/pr-autopilot-transient-retry-test.sh

      - name: Merge actor re-verifies a stale already-terminal snapshot before skipping
        run: bash tests/pr-autopilot-stale-snapshot-test.sh

      - name: Merge actor caches a live-verified terminal PR across ticks
        run: bash tests/pr-autopilot-reconcile-cache-test.sh

      - name: Merge actor never reconciles a step-tracking wisp instead of the real work bead
        run: bash tests/pr-autopilot-step-wisp-collision-test.sh

      - name: Merge actor prefers the still-open real work bead over a closed duplicate match
        run: bash tests/pr-autopilot-candidate-duplicate-test.sh

      - name: Check rollup rebuilt from Actions runs (fine-grained token)
        run: python tests/factory-gh-rollup-test.py

      - name: Delivery-proof completeness rules
        run: python tests/factory-delivery-proof-test.py

      - name: Factory guard backfills or flags undocumented delivery beads
        run: bash tests/factory-delivery-guard-test.sh

      - name: Goal delivery pairs across rigs
        run: bash tests/goal-delivery-pairs-test.sh

      - name: Factory guard clears stale dispatch-drift assignees
        run: bash tests/factory-dispatch-guard-test.sh

      - name: HQ Factory work uses its workspace-inherited implementation role
        run: bash tests/factory-work-dispatch-test.sh

      - name: Factory guard clears or flags stale gc.waiting_on
        run: bash tests/factory-waiting-guard-test.sh

      - name: Factory guard flags unraised Planning Exceptions and unauthorized redecomposition
        run: bash tests/factory-planning-exception-guard-test.sh

      - name: Main-landing gate blocks a broken push to main
        run: bash tests/factory-main-gate-test.sh

      - name: Pre-push blocks any branch when a new test file is not registered in CI
        run: bash tests/pre-push-ci-registration-test.sh

      - name: Real-PII leak guard blocks a real identifier leaving the machine
        run: bash tests/factory-pii-guard-test.sh

      - name: Provenance guard blocks unmarked fixture/seed/test-resource data
        run: bash tests/factory-provenance-guard-test.sh

      - name: Chronic order failures page the mayor
        run: bash tests/on-order-failed-test.sh

      - name: Stranded sessions reopen orphaned work
        run: bash tests/on-session-stranded-test.sh

      - name: Factory guard repairs a lost bin/ executable bit (af-ogg8z)
        run: bash tests/factory-guard-exec-bit-test.sh

      - name: Live-root guard refuses commit/checkout/reset in the live root (af-ogg8z)
        run: bash tests/factory-live-root-guard-test.sh

      - name: mol-do-work isolates HQ dispatches in a worktree (af-ogg8z)
        run: bash tests/factory-do-work-workspace-test.sh

      - name: Every test is registered in CI
        run: bash tests/ci-registration-test.sh
