name: Factory CI

# The gate that lets agent-factory PRs merge themselves. Without a required
# check there is nothing to gate on, so branches pile up unmerged — which is
# exactly what happened up to 2026-09-15 (28 branches, 21 commits of drift).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Factory Python runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Syntax check every Python and shell entry point
        run: |
          set -euo pipefail
          python -m compileall -q lib tests
          for f in bin/*; do
            head -1 "$f" | grep -q 'bash\|sh$' && bash -n "$f" && echo "ok $f" || true
          done

      - name: Ensure fixture sandbox runtime
        run: |
          packages=()
          command -v bwrap >/dev/null || packages+=(bubblewrap)
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            command -v apparmor_parser >/dev/null || packages+=(apparmor)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo apparmor_parser --replace --skip-read-cache --skip-cache \
              config/fixture-city-bwrap.apparmor
          fi

      # Every tests/*.sh and tests/*.py file runs here automatically -- adding
      # a test is adding a file, not editing this workflow (P01, af-tltj3).
      # A file that needs the live gc/bd runtime and a Dolt server (which this
      # runner does not have) opts out with a `# ci: local-only — <reason>`
      # marker instead; tests/ci-registration-test.sh (run below, discovered
      # like any other test) fails closed on a file that does neither.
      - name: Discover and run every registered test
        run: bin/ci-run-tests
