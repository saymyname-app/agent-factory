name: Factory CI

# The gate that lets agent-factory PRs merge themselves. Without a required
# check there is nothing to gate on, so branches pile up unmerged — which is
# exactly what happened up to 2026-09-15 (28 branches, 21 commits of drift).
#
# The repository is public since 2026-10-11: on GitHub's runners a minute is
# billed nothing, so the number of lots and their order are chosen for the
# time between a push and a green or a red "Tests" (af-vqew1x). What was
# measured while the minutes were billed, and the choices of that time that
# still hold (no run on push, a replaced run cancelled, one file per core):
# docs/OPERATIONS.md, "Factory CI cost and the Actions quota" (af-mzuprx).
# With the repository variable FACTORY_CI_RUNNER=self-hosted the same jobs
# run on the host's own runner instead, 0 billed minute: same file,
# "Factory CI on the host's own runner" (af-r1ymfm); `bin/ci-runner mode`
# sets and removes the variable.
on:
  pull_request:
    branches: [main]
  # GitHub's merge queue asks for the required check on the commit it is
  # about to put on main: main, the pull requests ahead in the queue and
  # this one. Without this trigger "Tests" is never reported on that commit
  # and nothing queued can merge. While the ruleset requires no queue, the
  # event never happens. Such a run is always a full run (af-t3tm88).
  merge_group:
    types: [checks_requested]
    branches: [main]
  # No run on `push` to main: the required merge-group run tests the
  # combined commit before the queue merges it. A post-merge run gates
  # nothing. Before the queue trial, strict up-to-date PR checks served
  # that role; duplicate post-merge runs were 30% of the billed minutes.
  # A run on main, when one is wanted, is started by hand.
  workflow_dispatch:

# A new commit on a pull request stops the run of the commit it replaces:
# that run can no longer let anything merge.
concurrency:
  group: factory-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # The job named "Tests" reads the result of the other lots of its own run.
  actions: read

# The tests run in LOTS lots, one runner each (bin/ci-run-tests --shard),
# and each runner runs as many test files at once as it has cores (--jobs):
# the tests are bound by the processor. Each lot pays about twenty seconds
# of setup and ends the run sooner, down to the longest test file, which
# runs alone on one core: more lots than that file allows shorten nothing
# (docs/OPERATIONS.md, "How long a run lasts"). The lots are dealt by the
# seconds each file took in a real run (config/ci-test-seconds.tsv): the
# run lasts as long as its longest lot.
# Lot 1 is the job named "Tests": the one status check the repository
# ruleset requires and bin/pr-autopilot gates on. It exists from the first
# second of the run, as before, and ends green only when its own lot and
# every other lot passed -- a job that merely waited on the lots (`needs`)
# would report nothing while they run, which the autopilot reads as "no
# status check ever reported".
# The host's own runner takes one job at a time: there the run is one lot,
# "Tests" alone (several lots would wait on each other for ever, "Tests"
# holding the runner while it waits for lots that need it).
env:
  LOTS: ${{ vars.FACTORY_CI_RUNNER == 'self-hosted' && '1' || '6' }}
  # A pull request that changes only areas the long tests cannot reach
  # (config/ci-long-test-blind-areas.txt: docs, the Cockpit) runs without
  # them; any other pull request, and any doubt, runs everything
  # (bin/ci-run-tests --changed-since, af-5mw6z0). The switch back: '1' here
  # makes every run a full run again. A run started by hand is always full.
  CI_RUN_TESTS_FULL: '0'

jobs:
  tests:
    name: ${{ matrix.lot == 1 && 'Tests' || format('Lot {0}', matrix.lot) }}
    runs-on: ${{ vars.FACTORY_CI_RUNNER == 'self-hosted' && 'factory-ci' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        lot: ${{ fromJSON(vars.FACTORY_CI_RUNNER == 'self-hosted' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit this run tests and its first parent, the tip of
          # main: what the pull request changes is read between the two.
          fetch-depth: 2

      # On the host's own runner the job runs in a container that holds
      # nothing of the host. This tries what it must not be able to do (the
      # operator's files, root, the host's local services, the private
      # networks) and fails the run if one attempt succeeds.
      - name: The job cannot reach the host
        if: runner.environment == 'self-hosted'
        run: bash config/ci-runner/isolation-probe.sh

      # The image of the host's own runner already holds Python 3.12 and
      # PyYAML 6.0.2 (config/ci-runner/Containerfile).
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'

      - name: Install Factory Python runtime dependencies
        if: runner.environment == 'github-hosted'
        run: python -m pip install PyYAML==6.0.2

      # Every file of bin/ is checked, the whole list is printed, and one bad
      # file fails the step. Until af-fyc8eo the shell line ended with
      # `|| true`, there to skip the Python files: on 2026-10-06 a syntax
      # error of bin/escalation-door was printed here, the step stayed green
      # and 8 test files went red later in the run. A first line that names
      # neither Python nor a shell fails too: a file nothing checks is the
      # same hole. tests/ci-syntax-check-test.sh runs this script on broken
      # files.
      - name: Syntax check every Python and shell entry point
        run: |
          set -euo pipefail
          python -m compileall -q lib tests
          failed=0
          for f in bin/*; do
            case "$(head -n 1 "$f")" in
              '#!'*python*) python -c 'import sys; compile(open(sys.argv[1], encoding="utf-8").read(), sys.argv[1], "exec")' "$f" ;;
              '#!'*sh*) bash -n "$f" ;;
              *) echo "$f: its first line names neither Python nor a shell" >&2; false ;;
            esac && echo "ok $f" || { failed=1; echo "FAIL $f" >&2; }
          done
          exit "$failed"

      # Nothing to do on the host's own runner, which has no sudo: its image
      # holds bwrap and its kernel does not restrict user namespaces.
      - name: Ensure fixture sandbox runtime
        run: |
          packages=()
          command -v bwrap >/dev/null || packages+=(bubblewrap)
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            command -v apparmor_parser >/dev/null || packages+=(apparmor)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo apparmor_parser --replace --skip-read-cache --skip-cache \
              config/fixture-city-bwrap.apparmor
          fi

      # The second project of the Delivery Fixture City is a JSON API on
      # Node.js (T35, af-f62cxt): its launch recipe, its test command and its
      # regression command run `node`. The runner ships it in /usr/local/bin,
      # which is on the bare PATH the Fixture City Oracle gives its adapters.
      - name: Ensure Node.js for the second fixture project
        run: PATH=/usr/local/bin:/usr/bin:/bin node --version

      # Every tests/*.sh and tests/*.py file runs here automatically -- adding
      # a test is adding a file, not editing this workflow (P01, af-tltj3).
      # A file that needs the live gc/bd runtime and a Dolt server (which this
      # runner does not have) opts out with a `# ci: local-only — <reason>`
      # marker instead; tests/ci-registration-test.sh (run below, discovered
      # like any other test) fails closed on a file that does neither.
      - name: Discover and run every registered test of this lot
        run: |
          echo "cores: $(nproc)"
          # On a pull request HEAD is the merge of the branch into main, and
          # main is its first parent. Anything else is a full run.
          since=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            since=(--changed-since 'HEAD^1')
          fi
          # In every lot the rule checks go first, and a red one stops the
          # lot there: a stale catalogue or a lint is red on its lot after
          # about a minute instead of after the long tests. On the host's
          # own runner since af-r1ymfm (Benjamin, 2026-10-08); on GitHub's
          # runners since the repository is public and the minute billed
          # nothing (af-vqew1x; Benjamin, 2026-10-11). Green, every test ran.
          first=(--rule-checks-first)
          bin/ci-run-tests --shard "${{ matrix.lot }}/$LOTS" --jobs "$(nproc)" "${since[@]}" "${first[@]}"

      - name: Wait for the other lots
        if: matrix.lot == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          others=$((LOTS - 1))
          for _ in $(seq 1 360); do
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("Lot ")) | {name, status, conclusion}]') || jobs='[]'
            # A lot that ended red: the run is red whatever the others do,
            # so "Tests" says it now instead of when the longest lot ends.
            red=$(jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "\(.name): \(.conclusion)"' <<<"$jobs")
            if [ -n "$red" ]; then
              echo "$red"
              echo "a lot failed: see its own job for the failing test (the lots still running are not waited for)" >&2
              exit 1
            fi
            total=$(jq length <<<"$jobs")
            running=$(jq '[.[] | select(.status != "completed")] | length' <<<"$jobs")
            if [ "$total" -eq "$others" ] && [ "$running" -eq 0 ]; then
              jq -r '.[] | "\(.name): \(.conclusion)"' <<<"$jobs"
              if [ "$SECONDS" -gt 180 ]; then
                echo "::warning::Tests waited ${SECONDS}s for the other lots: they are uneven, and the run lasts as long as the longest. Refresh config/ci-test-seconds.tsv with bin/ci-test-seconds (docs/OPERATIONS.md, Keeping the lots even)."
              fi
              exit 0
            fi
            sleep 10
          done
          echo "the other lots did not finish within an hour" >&2
          exit 1
